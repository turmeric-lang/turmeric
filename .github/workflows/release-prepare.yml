name: Release (prepare)

# Stage 1 of the CI release cut -- docs/upcoming/ci-release-workflows-plan.md.
#
# Bumps the version, drafts the CHANGELOG entry and README "Latest release"
# line with an LLM (tools/release_prepare.py, over the Mistral API), and opens
# a `release/vX.Y.Z` PR.  A human edits the draft in review -- that review is
# what the `/cut-*-release` skills' AskUserQuestion gate used to be -- and
# merging it fires release-deploy.yml.  Nothing here deploys or tags.
#
# workflow_dispatch is limited to users with write access, which is the whole
# access control the plan asks for.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        type: choice
        options: [patch, minor, major]
        default: minor
      models:
        description: >-
          Model order for the draft, comma-separated, each MODEL or
          MODEL@EFFORT (blank = the tool's default order)
        type: string
        default: ""

# One prepare at a time: two concurrent runs would both compute the same NEW
# from the same VERSION and race for the same branch name.
concurrency:
  group: release-prepare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare v-next (${{ inputs.bump }})
    runs-on: ubuntu-latest
    steps:
      # RELEASE_PAT, not GITHUB_TOKEN, for two reasons that both bite:
      #  1. The repo setting "Allow GitHub Actions to create and approve pull
      #     requests" is off, so GITHUB_TOKEN cannot open the PR at all.
      #  2. A branch pushed / PR opened with GITHUB_TOKEN does not trigger
      #     other workflows, so ci.yml would never run on the release PR --
      #     and its run is the quality gate this two-stage flow relies on.
      - name: Require RELEASE_PAT
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "::error::secret RELEASE_PAT is not set -- see 'Secrets to add' in docs/upcoming/ci-release-workflows-plan.md"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Full history and tags: the draft reads `git log vOLD..HEAD`.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Preconditions
        run: |
          OLD=$(cat VERSION)
          LAST=$(git describe --tags --abbrev=0 --match 'v*')
          echo "VERSION=$OLD  last tag=$LAST"
          if [ "$LAST" != "v$OLD" ]; then
            echo "::error::VERSION ($OLD) does not match the latest tag ($LAST); a previous release did not finish -- check release-deploy.yml's last run"
            exit 1
          fi

      # The draft step never fails the job over the API: if every model
      # fails it writes a rough subject-line draft and the PR body says so.
      - name: Bump version + draft release notes
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          RELEASE_MODELS: ${{ inputs.models }}
        run: |
          python3 tools/release_prepare.py --bump "${{ inputs.bump }}" \
            --apply --out "$RUNNER_TEMP/release"
          echo "NEW=$(cat "$RUNNER_TEMP/release/new_version")" >> "$GITHUB_ENV"
          git diff --stat

      - name: Open the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          BRANCH="release/v$NEW"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "::error::$BRANCH already exists -- close/delete it (or merge it) first"
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add VERSION stdlib/VERSION src/web/wasm_glue.h web/public/sw.js CHANGELOG.md README.md
          SUMMARY=$(sed -n 's/^\*\*Latest release:\*\* `v[^`]*` -- //p' README.md)
          git commit -m "chore: release v$NEW" -m "$SUMMARY"
          git push origin "$BRANCH"
          gh label create release --color 0E8A16 \
            --description "Release-prep PR from release-prepare.yml" 2>/dev/null || true
          gh pr create --base main --head "$BRANCH" \
            --title "chore: release v$NEW" \
            --label release \
            --body-file "$RUNNER_TEMP/release/pr_body.md" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the draft
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-draft
          path: ${{ runner.temp }}/release
          if-no-files-found: ignore

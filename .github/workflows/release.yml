name: Release

on:
  push:
    tags:
      - "v*"
  # Dry run.  Until this existed the only way to find out whether this workflow
  # works was to cut a release, which is the worst possible moment: every step
  # below the first failure is unexercised, and a tag is awkward to retract.
  # A manual run builds and uploads the artifacts and stops there -- the
  # `release` job is gated on a tag ref, so a dispatch can never publish.
  workflow_dispatch:

# C-5: read by default; the `release` job raises itself to `contents: write`
# (and, for C-4, to the two scopes build provenance needs).  The build jobs
# compile and upload artifacts and want nothing beyond read.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
            cmake_extra: ""
          - target: linux-aarch64
            os: ubuntu-24.04-arm
            cmake_extra: ""
          - target: macos-arm64
            os: macos-latest
            cmake_extra: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libedit-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libedit || true

      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build -j --config Release

      - name: Smoke test
        run: ./build/tur --version

      # PREFIX layout -- bin/, lib/, include/, share/ -- the same shape
      # build-windows below has always produced.  These three legs shipped flat
      # (`tur`, the .a files and stdlib/ all at the archive root) up to v0.46.0,
      # for one reason that no longer holds: at the time the flat tree matched
      # none of locate_runtime_lib's probes, so Windows was packaged the only
      # way that could compile.  <exe_dir> is probed now, so both work and the
      # difference is just four archives that do not look alike.
      #
      # The prefix layout is the one `tur` resolves natively rather than by
      # accommodation -- resolve_stdlib_root step 3 is
      # <exe_dir>/../share/turmeric/stdlib and locate_runtime_lib probes
      # <exe_dir>/../lib -- and it is what every consumer restaged into by hand.
      # See docs/archive/unify-release-archive-layout.md.
      #
      # KEEP the <exe_dir> probe in locate_runtime_lib regardless.  It costs one
      # stat and it is what lets an archive published before this change keep
      # working with a `tur` built after it.
      - name: Package
        run: |
          TAG=${GITHUB_REF_NAME}
          ARCHIVE="turmeric-${TAG}-${{ matrix.target }}.tar.gz"

          mkdir -p dist/bin dist/lib dist/include/turi dist/share/turmeric

          cp build/tur dist/bin/
          cp build/src/libturi.a dist/lib/
          # libturt_runtime.a is the one TUR_RT_AUTO will actually link.  Without
          # it in the archive, `tur run` from an extracted tarball fell back to
          # recompiling src/runtime/*.c -- which the archive does not ship -- and
          # failed at the C compile step.  Verified broken on macOS and Windows
          # before this; docs/archive/release-archive-cannot-compile.md.
          cp build/src/libturt_runtime.a dist/lib/
          # libturt_preamble.a is what lets a default build skip recompiling the
          # runtime preamble in every program (cc-path-preamble-split-plan).
          # Without it the build still works -- it keeps the whole preamble --
          # so a missing copy here would only ever show up as slowness.
          cp build/src/libturt_preamble.a dist/lib/
          # TUR_JIT defaults ON (vendored MIR), so libturi.a carries the JIT
          # engine's image API and links PUBLIC against MIR: a C host that
          # embeds libturi and calls that API needs libtur_mir.a beside it.
          # A plain `-lturi` link never pulls the engine's object in.  A hard
          # cp, so a build that lost the engine fails here rather than shipping.
          cp build/libtur_mir.a dist/lib/
          cp src/turi/eval.h src/turi/env.h src/turi/value.h src/turi/fiber.h dist/include/turi/
          cp -R stdlib dist/share/turmeric/

          tar -czf "${ARCHIVE}" -C dist .
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      # Unpack what was just built and compile with it.  `tur --version` above
      # proves the binary starts, which is a much weaker claim than it looks: the
      # archives passed that check for many releases while being unable to compile
      # a two-line program.  This is the check that would have caught it.
      - name: Compile a program from the extracted archive
        run: |
          rm -rf verify && mkdir verify
          tar -xzf "${ARCHIVE}" -C verify
          cat > verify/hello.tur <<'EOF'
          (defn main [] : int
            (println "hello from the archive")
            0)
          EOF
          out=$(cd verify && ./bin/tur run hello.tur 2>&1) || {
            printf '%s\n' "$out"
            echo "::error::the extracted archive cannot compile a program"
            exit 1
          }
          printf '%s\n' "$out"
          case "$out" in
            *"hello from the archive"*) echo "Archive compiles and runs." ;;
            *) echo "::error::unexpected output from the extracted archive"; exit 1 ;;
          esac

      # TUR_JIT defaults ON, so the shipped binary carries the MIR engine, and
      # linux-aarch64 is a leg no CI job runs the engine on.  Run the same
      # program through `tur jit` from the extracted archive.  TUR-W0070 is the
      # engine falling back to cc, which still prints the right answer -- so it
      # fails this check rather than passing it vacuously.
      #
      # Every leg is held to it, linux-aarch64 included.  That leg failed
      # v0.60.0: on glibc aarch64 the emitted unit reaches <ucontext.h> ->
      # sys/procfs.h -> sys/user.h, whose `__uint128_t` c2mir could not parse,
      # so the engine declined every program; a narrowed exception for that
      # one fallback stood here until the vendored fork fixed it
      # (turmeric-lang/mir#6, docs/archive/jit-xopen-source-guard-inert-on-glibc.md).
      # A TUR-W0070 on any leg is a regression now, not a known gap.
      - name: Run a program through the JIT from the extracted archive
        run: |
          # Whatever happens below, the engine's archive must be in the tarball:
          # that is the packaging guarantee this step exists for.
          if [ ! -f verify/lib/libtur_mir.a ]; then
            echo "::error::libtur_mir.a is missing from the archive -- the shipped engine is not there"
            exit 1
          fi

          out=$(cd verify && ./bin/tur jit hello.tur 2>&1) || {
            printf '%s\n' "$out"
            echo "::error::tur jit failed from the extracted archive"
            exit 1
          }
          printf '%s\n' "$out"

          # The answer is checked first and unconditionally -- a fallback that
          # prints the wrong thing is a different and worse bug.
          case "$out" in
            *"hello from the archive"*) ;;
            *) echo "::error::unexpected output from tur jit"; exit 1 ;;
          esac

          case "$out" in
            *TUR-W0070*)
              echo "::error::the JIT fell back to cc -- the engine did not run"
              exit 1
              ;;
            *) echo "The shipped JIT engine runs." ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turmeric-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # Windows is its own job rather than a matrix leg.  Every step needs
  # `shell: msys2 {0}` and the toolchain arrives through setup-msys2, neither of
  # which fits the matrix above -- the same reason ci.yml keeps its Windows legs
  # separate.
  build-windows:
    name: Build (windows-x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Keep LF line endings
        shell: bash
        run: git config --global core.autocrlf input

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            zip

      # The package is `wineditline`, not `libedit`.  Non-fatal, mirroring
      # ci.yml and the macOS legs: the build succeeds without it, just with a
      # degraded REPL, and an unavailable optional package must not be able to
      # fail a release.
      - name: Install optional REPL line editing (non-fatal)
        run: pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-wineditline || true

      - name: Toolchain versions
        run: |
          cc --version | head -1
          cmake --version | head -1

      # TUR_WIN_STATIC defaults ON (see the top-level CMakeLists) -- named here
      # anyway, because this is the build where it is load-bearing and a silent
      # default flip would ship a binary that cannot start.
      - name: Configure (Release)
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTUR_WIN_STATIC=ON
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build -j

      - name: Smoke test
        run: ./build/tur.exe --version

      # THE check for this job.  A default MinGW build needs libwinpthread-1.dll
      # and edit.dll out of the MSYS2 tree; off an MSYS2 PATH such a binary exits
      # 127 with no output and no diagnostic, so an archive built that way is dead
      # on arrival and says nothing about why.  Both halves are here on purpose:
      # ldd names the offending DLL, and the stripped-PATH run is the actual
      # failure mode a user would hit.
      - name: Verify the binary is self-contained
        run: |
          raw=$(ldd build/tur.exe) || {
            echo "::error::ldd failed on build/tur.exe; this check cannot run."
            exit 1
          }
          # An absent or broken ldd would make the grep below match nothing and
          # the check pass having verified nothing.  Every Windows binary links
          # KERNEL32, so its absence means the output is not what we think it is.
          case "$raw" in
            *KERNEL32*|*kernel32*) ;;
            *) printf '%s\n' "$raw"
               echo "::error::ldd output does not name KERNEL32 -- unrecognised format, so a clean result here would be meaningless."
               exit 1 ;;
          esac
          deps=$(printf '%s\n' "$raw" | grep -iE "/(ucrt64|mingw64|clang64|msys64)/" || true)
          if [ -n "$deps" ]; then
            echo "$deps"
            echo "::error::tur.exe depends on DLLs from the MSYS2 tree; it will not start on a machine without MSYS2. Is TUR_WIN_STATIC still ON, and is CMAKE_FIND_LIBRARY_SUFFIXES still preferring .a?"
            exit 1
          fi
          out=$(PATH="/c/Windows/System32:/c/Windows" ./build/tur.exe --version 2>&1) || {
            echo "$out"
            echo "::error::tur.exe failed to run with MSYS2 off PATH -- exactly what a user unpacking the archive would see."
            exit 1
          }
          echo "$out"
          echo "Self-contained: no MSYS2 DLLs, runs with MSYS2 off PATH."

      # PREFIX layout -- bin/, lib/, include/, share/ -- which the `build` legs
      # above now share.  This job has always used it: at the time it was added
      # a flat tree matched none of locate_runtime_lib's probes, so `tur run`
      # from a flat extract could not compile anything, and this was the only
      # shape that worked.  <exe_dir> is probed now, so the shape is no longer
      # forced here -- but it stays, because it is the one
      # <exe_dir>/../lib and resolve_stdlib_root step 3 resolve natively.
      # docs/archive/unify-release-archive-layout.md.
      - name: Package
        run: |
          TAG=${GITHUB_REF_NAME}
          ARCHIVE="turmeric-${TAG}-windows-x86_64.zip"

          mkdir -p dist/bin dist/lib dist/include/turi dist/share/turmeric

          cp build/tur.exe dist/bin/
          cp build/src/libturt_runtime.a dist/lib/
          cp build/src/libturt_preamble.a dist/lib/
          cp build/src/libturi.a dist/lib/
          # See the `build` legs: the JIT engine's MIR, for libturi embedders.
          cp build/libtur_mir.a dist/lib/
          cp src/turi/eval.h src/turi/env.h src/turi/value.h src/turi/fiber.h dist/include/turi/
          cp -R stdlib dist/share/turmeric/

          # zip rather than tar.gz: Explorer opens one and not the other.  The
          # release job checksums whatever it finds, so the format is free.
          (cd dist && zip -qr "../${ARCHIVE}" .)
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      # Unpack what was just built and compile a program with it.  The other legs
      # smoke-test `--version`, which proves only that the binary starts -- this
      # archive passed that check while being unable to compile a two-line
      # program, because the runtime archive was not where tur looks for it.
      - name: Compile a program from the extracted archive
        run: |
          rm -rf verify && mkdir verify
          (cd verify && unzip -q "../${ARCHIVE}")
          cat > verify/hello.tur <<'EOF'
          (defn main [] : int
            (println "hello from the archive")
            0)
          EOF
          out=$(cd verify && ./bin/tur.exe run hello.tur 2>&1) || {
            printf '%s\n' "$out"
            echo "::error::the extracted archive cannot compile a program"
            exit 1
          }
          printf '%s\n' "$out"
          case "$out" in
            *"hello from the archive"*) echo "Archive compiles and runs." ;;
            *) echo "::error::unexpected output from the extracted archive"; exit 1 ;;
          esac

      # As on the `build` legs: the shipped engine, from the extracted archive,
      # with a cc fallback (TUR-W0070) counted as a failure.
      - name: Run a program through the JIT from the extracted archive
        run: |
          out=$(cd verify && ./bin/tur.exe jit hello.tur 2>&1) || {
            printf '%s\n' "$out"
            echo "::error::tur jit failed from the extracted archive"
            exit 1
          }
          printf '%s\n' "$out"
          case "$out" in
            *TUR-W0070*) echo "::error::the JIT fell back to cc -- the engine did not run"; exit 1 ;;
            *"hello from the archive"*) echo "The shipped JIT engine runs." ;;
            *) echo "::error::unexpected output from tur jit"; exit 1 ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turmeric-windows-x86_64
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
  # OD4: the rendered documentation, as a downloadable archive.
  #
  # Guides and API pages are readable offline in Try Turmeric (OD3), but
  # someone working in a terminal with no network had no copy at all. This
  # builds the same docs/html/ the website serves, plus the docs pack, and
  # attaches them to the release; unpacked into <prefix>/share/doc/turmeric/
  # it is what `tur docs --open` finds. Platform-independent, so it runs once
  # rather than per matrix leg.
  docs:
    name: Package docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # genguides.py dates each guide from the commit that added it.
          fetch-depth: 0

      - name: Install doc generator dependencies
        # C-5: --require-hashes.  This job builds the turmeric-docs tarball the
        # release publishes, so its Python inputs are release inputs.
        run: python3 -m pip install --require-hashes -r tools/requirements.txt

      - name: Build the docs and the docs pack
        run: |
          python3 tools/genguides.py docs/guides/ --out docs/html/guides/ \
                  --emit-pack web/public/docs-pack/
          python3 tools/genspices.py --out docs/html/spices/ \
                  --emit-json docs/html/spices/doc-names-spices.json \
                  --emit-pack web/public/docs-pack/
          python3 tools/gendocs.py stdlib/ --out docs/html/api/ \
                  --emit-json web/public/doc-names.json \
                  --extra-json docs/html/spices/doc-names-spices.json \
                  --emit-pack web/public/docs-pack/
          python3 tools/genpack.py web/public/docs-pack/

      - name: Package
        run: |
          TAG=${GITHUB_REF_NAME}
          ARCHIVE="turmeric-docs-${TAG}.tar.gz"
          tar -czf "${ARCHIVE}" \
              --transform "s,^,turmeric-docs-${TAG}/," \
              -C . docs/html web/public/docs-pack
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turmeric-docs
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build, build-windows, docs]
    # startsWith(...refs/tags/) is what makes workflow_dispatch safe: a manual
    # run produces artifacts to inspect and never creates a release.
    #
    # Every leg must SUCCEED, not merely avoid cancellation.  Checking only for
    # 'cancelled' let a FAILED leg through, and `files: artifacts/*` then
    # published whatever had managed to upload: v0.56.1 and v0.56.2 both went
    # out with no turmeric-<tag>-linux-aarch64.tar.gz, with nothing on the
    # release page or in the run's conclusion-at-a-glance saying a platform was
    # missing.  One compile error became two silently incomplete releases.
    # A broken leg must strand the tag instead -- that is recoverable, by
    # re-running this workflow once the build is fixed, and a partial release
    # is not.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/')
      && needs.build.result == 'success'
      && needs.build-windows.result == 'success'
      && needs.docs.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # C-4: build provenance. `id-token: write` mints the OIDC token that
      # identifies this workflow run to Sigstore; `attestations: write` stores
      # the signed statement against the repo. Both are scoped to this job --
      # the build legs never hold either.
      id-token: write
      attestations: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      # C-4 in docs/upcoming/security-audit-plan.md. Until now every release
      # asset was unsigned: sha256sums.txt says the bytes did not change in
      # transit, but it is served from the same origin as the assets, so it is
      # integrity and never authenticity. Anyone who can write to the release
      # page can rewrite both together.
      #
      # This binds each asset to the workflow, repository, commit and run that
      # produced it, signed through Sigstore with a short-lived certificate
      # minted from the job's OIDC token -- there is no long-lived key for
      # anyone to lose. A consumer verifies with:
      #
      #   gh attestation verify turmeric-<tag>-<target>.tar.gz \
      #     --repo turmeric-lang/turmeric
      #
      # Assets built BEFORE the 2026-10-02 org move need `--owner rjungemann`
      # instead: the attestation lives in the owning account's index, which a
      # repo transfer does not move, so `--repo` 404s for those under either
      # owner name.  Measured on v0.59.0.
      #
      # Placed AFTER the checksums step so sha256sums.txt is attested too, and
      # BEFORE the release is created so a failure here strands the tag rather
      # than publishing unattested assets -- the same posture the `if:` above
      # takes for a failed build leg.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true

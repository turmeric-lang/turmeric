name: "Release: cut"

# One dispatch cuts a release, no human step -- docs/archive/ci-release-workflows-plan.md.
#
#   prepare     bump, draft the notes over the Mistral API, VALIDATE (a bad
#               draft fails here), commit to the scratch branch release/vNEW
#   deploy-web  build Try Turmeric from that commit, deploy-gate, migrate the
#               /ci D1 database, deploy (deploy-web.yml, also run by hand)
#   publish     open + merge the release PR, tag, dispatch release.yml
#
# Nothing a user or a clone can see changes before `publish`: the scratch
# branch is the only residue of a failed run.  The deploy precedes the tag,
# the same invariant the `/cut-*-release` skills keep, so a failed deploy never
# strands a tag.
#
# No PAT.  `main` takes changes only through a PR (branch protection, 0
# approvals), so `publish` opens one and merges it with GITHUB_TOKEN.  A tag
# pushed with GITHUB_TOKEN triggers no workflow, but a workflow_dispatch made
# with it does -- so `publish` dispatches release.yml at the tag ref, where its
# `startsWith(github.ref, 'refs/tags/')` gate lets it publish.
#
# Requires the repo setting "Allow GitHub Actions to create and approve pull
# requests" (for the PR), and secrets MISTRAL_API_KEY, CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        type: choice
        options: [patch, minor, major]
        default: minor
      dry_run:
        description: Draft the notes and stop -- push, deploy and publish nothing
        type: boolean
        default: false
      allow_rough_notes:
        description: >-
          If no model produces valid notes, ship raw commit subjects instead of
          failing (for an API outage)
        type: boolean
        default: false
      models:
        description: >-
          Model order, comma-separated, each MODEL or MODEL@EFFORT (blank = the
          tool's default order)
        type: string
        default: ""

# Two overlapping cuts is the one genuinely unrecoverable mess here.
concurrency:
  group: release-cut
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare (${{ inputs.bump }}${{ inputs.dry_run && ', dry run' || '' }})
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the scratch branch
    outputs:
      new: ${{ steps.draft.outputs.new }}
      sha: ${{ steps.commit.outputs.sha }}
      base: ${{ steps.pre.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Full history and tags: the draft reads `git log vOLD..HEAD`.
          fetch-depth: 0

      - name: Preconditions
        id: pre
        run: |
          OLD=$(cat VERSION)
          LAST=$(git describe --tags --abbrev=0 --match 'v*')
          echo "VERSION=$OLD  last tag=$LAST  main=$(git rev-parse HEAD)"
          if [ "$LAST" != "v$OLD" ]; then
            echo "::error::VERSION ($OLD) does not match the latest tag ($LAST) -- a previous cut did not finish"
            exit 1
          fi
          stale=$(git ls-remote --heads origin 'release/v*' | awk '{print $2}')
          if [ -n "$stale" ]; then
            echo "::warning::leftover scratch branch(es) from an earlier cut: $stale"
          fi
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Bump version + draft release notes
        id: draft
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          RELEASE_MODELS: ${{ inputs.models }}
        run: |
          # Not `inputs.x && '' || '--strict'`: '' is falsy in an expression,
          # so that always yields --strict.
          if [ "${{ inputs.allow_rough_notes }}" = true ]; then STRICT=; else STRICT=--strict; fi
          python3 tools/release_prepare.py --bump "${{ inputs.bump }}" \
            --apply $STRICT --out "$RUNNER_TEMP/release" | tee "$RUNNER_TEMP/draft.md"
          NEW=$(cat "$RUNNER_TEMP/release/new_version")
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          {
            echo "## v$NEW -- drafted release notes"
            echo
            echo '```markdown'
            cat "$RUNNER_TEMP/draft.md"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the draft
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-draft
          path: ${{ runner.temp }}/release
          if-no-files-found: ignore

      - name: Commit to the scratch branch
        id: commit
        if: ${{ !inputs.dry_run }}
        env:
          NEW: ${{ steps.draft.outputs.new }}
        run: |
          BRANCH="release/v$NEW"
          if git ls-remote --exit-code --tags origin "refs/tags/v$NEW" >/dev/null; then
            echo "::error::tag v$NEW already exists"
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add VERSION stdlib/VERSION src/web/wasm_glue.h web/public/sw.js CHANGELOG.md README.md
          SUMMARY=$(sed -n 's/^\*\*Latest release:\*\* `v[^`]*` -- //p' README.md)
          # [skip ci]: `publish` merges the release PR a second or two after
          # opening it, so ci.yml's pull_request run for it was created and then
          # died before starting a job -- a red CI run with no jobs on every
          # release (v0.65.0, v0.65.1, v0.65.2).  The marker on the PR's head
          # commit means GitHub never creates that run.  Nothing is lost: the
          # run never got to a job, and the merged commit is not tested on main
          # either (a GITHUB_TOKEN merge triggers nothing).
          #
          # The marker rides the rebase onto main.  It does not touch the
          # release.yml run `publish` dispatches -- skip markers apply only to
          # push and pull_request events -- but a vNEW tag pushed BY HAND onto
          # this commit is a push whose head commit carries it, so it would not
          # start release.yml's tag trigger.  Rebuild with
          # `gh workflow run release.yml --ref vNEW`, as `publish` does.
          git commit -m "chore: release v$NEW" -m "$SUMMARY" -m "[skip ci]"
          # --force: a scratch branch left by a failed run of THIS version is
          # stale by definition; the run that made it never published.
          git push --force origin "$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The same job `Deploy: Try Turmeric` runs on a manual dispatch: build,
  # deploy-gate, apply pending /ci D1 migrations, deploy.
  deploy-web:
    name: Build, gate and deploy Try Turmeric
    needs: prepare
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/deploy-web.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-spices:
    name: Build and deploy spices.turmeric-lang.com
    needs: prepare
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      # Deploys from turmeric-spices main, not the release scratch branch: the
      # spices site is its own repo, and a spice landing between two turmeric
      # releases should not wait for the next cut to appear online.  Full
      # history so genguides can date each guide from git.
      - name: Check out turmeric-spices
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/turmeric-spices
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # No pip install: the spices repo's genguides.py and genspices.py render
      # Markdown with tur/markdown, as this repo's do (markdown-library-plan
      # M4), so they need a tur and no Python package.  This one is built from
      # the release being cut, beside the workspace in .turmeric/ -- outside
      # web/dist, so none of it reaches the deploy.  A Release build of the
      # one target, as deploy-web makes.
      - name: Check out turmeric (for tur)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: .turmeric
          persist-credentials: false

      - name: Install dependencies (Linux)
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update || { sleep 20; sudo apt-get update; }
          sudo apt-get install -y libedit-dev

      - name: Build native tur (Release; renders the Markdown)
        run: |
          cmake -S .turmeric -B .turmeric/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build .turmeric/build -j --target tur

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # Mirrors the spices repo's `tur run deploy-web` recipe: render guides +
      # spice pages, copy them with the static assets into web/dist, deploy.
      - name: Generate spice docs
        env:
          TUR: ${{ github.workspace }}/.turmeric/build/tur
        run: |
          python3 tools/genguides.py docs/guides/ --out docs/html/guides/
          python3 tools/genspices.py --out docs/html/ --emit-json docs/html/doc-names-spices.json

      - name: Build web bundle
        run: |
          rm -rf web/dist
          mkdir -p web/dist
          cp -R docs/html/. web/dist/
          cp -R web/public/. web/dist/
          cp -R web/styles web/dist/styles

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Deploy to Cloudflare
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

  publish:
    name: Merge, tag v${{ needs.prepare.outputs.new }}, dispatch release.yml
    needs: [prepare, deploy-web, deploy-spices]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # merge, tag, delete the scratch branch
      pull-requests: write   # open the release PR
      actions: write         # dispatch release.yml
    env:
      GH_TOKEN: ${{ github.token }}
      NEW: ${{ needs.prepare.outputs.new }}
      SHA: ${{ needs.prepare.outputs.sha }}
      BASE: ${{ needs.prepare.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Merge the release commit into main
        run: |
          # The deploy built SHA, whose parent is BASE.  If main moved since,
          # merging would publish a tree nobody deployed: stop, re-dispatch.
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$BASE" ]; then
            echo "::error::main moved during the cut ($BASE -> $(git rev-parse origin/main)); re-dispatch. The site is already on v$NEW, which the next cut will redeploy."
            exit 1
          fi
          gh pr create --base main --head "release/v$NEW" \
            --title "chore: release v$NEW" \
            --body "$(git log -1 --format=%b "$SHA")

          Opened and merged by \`release-cut.yml\` run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}, after Try Turmeric and the spices site deployed."
          # --rebase re-creates the commit (new SHA) but with SHA's tree, as
          # main has not moved; the tree check below is what proves the tag
          # lands on exactly what was deployed.  Retried: a merge straight
          # after create can race GitHub's mergeability computation.
          for i in 1 2 3 4 5 6; do
            gh pr merge "release/v$NEW" --rebase --delete-branch \
              --match-head-commit "$SHA" && break
            [ "$i" = 6 ] && exit 1
            sleep 10
          done
          git fetch -q origin main
          if [ "$(git rev-parse "origin/main^{tree}")" != "$(git rev-parse "$SHA^{tree}")" ]; then
            echo "::error::main's tree after the merge differs from the deployed commit -- not tagging"
            exit 1
          fi

      - name: Tag and dispatch release.yml
        run: |
          # Annotated, not signed -- C-4 in docs/upcoming/security-audit-plan.md.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$NEW" -m "Release v$NEW" origin/main
          git push origin "v$NEW"
          # A GITHUB_TOKEN tag push starts no workflow; a dispatch does.
          gh workflow run release.yml --ref "v$NEW"
          {
            echo "## Released v$NEW"
            echo
            echo "- main: \`$(git rev-parse --short origin/main)\`"
            echo "- site: https://turmeric-lang.com"
            echo "- spices: https://spices.turmeric-lang.com"
            echo "- binaries: release.yml dispatched at \`v$NEW\` -- ${{ github.server_url }}/${{ github.repository }}/actions/workflows/release.yml"
          } >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  # `branches: [main]` is load-bearing beyond the obvious: it is what keeps this
  # workflow off the `ci-metrics` orphan branch, which tools/ci/publish-timings.sh
  # pushes to on every green `main` run.  That branch carries no source at all
  # (one JSONL file per year plus a README), so a build there would be both
  # meaningless and self-perpetuating -- each publish would trigger a run whose
  # own publish triggers another.  Do NOT widen this to `branches-ignore` or an
  # unfiltered `push:` without excluding ci-metrics explicitly.  The publish
  # commits additionally carry [skip ci] as a second, independent layer.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# C-5 in docs/upcoming/security-audit-plan.md.  The repo's default workflow
# token is already `read`, so this block grants nothing new today -- it moves
# that guarantee out of a web-UI setting, where one checkbox silently re-widens
# every job in this file and no diff records it, and into the tree where a
# change to it has to survive review.  `publish-timings` raises itself to
# `contents: write` locally; nothing else here needs more than read.
permissions:
  contents: read

jobs:
  # Docs-only gate.  A PR that touches nothing outside docs/ cannot change what
  # the compiler does, so the build-and-suite jobs below are skipped for it --
  # including their macOS legs, which wait on a small shared runner pool (see
  # docs/upcoming/ci-aux-suite-latency-plan.md section 3).  A skipped job
  # reports "skipped", which is not a failure.
  #
  # Two outputs, because docs/ is not all inert:
  #   code   -- something outside docs/ changed.  Every job runs.
  #   guides -- something under docs/guides/ changed.  The guides are rendered
  #             and link-checked by web-smoke (`tur run docs` ends in
  #             `genpack.py --strict-links`), and checked by check-guides and
  #             check-spaced-types, so those three still run.
  # docs-lint (below) always runs: it holds the ctest checks that read docs/
  # and need no build, which a docs-only PR would otherwise never reach.
  #
  # Pushes to main, and anything this step cannot classify, count as code:
  # main keeps its full run per merge, and the gate fails open.
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      guides: ${{ steps.classify.outputs.guides }}
    steps:
      # A pull_request run checks out the merge commit; its first parent is
      # the base branch tip, so HEAD^1..HEAD is exactly the PR's change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: classify
        run: |
          code=true
          guides=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] \
             && files=$(git diff --name-only HEAD^1 HEAD) && [ -n "$files" ]; then
            echo "$files"
            grep -qv '^docs/' <<<"$files" || code=false
            grep -q '^docs/guides/' <<<"$files" || guides=false
          fi
          echo "code=$code guides=$guides"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "guides=$guides" >> "$GITHUB_OUTPUT"

  # The ctest checks that read docs/ and need no compiler.  They also run
  # inside the `test` job's ctest; this copy is what covers a docs-only PR,
  # where `test` is skipped.  Seconds on ubuntu, so it runs unconditionally.
  docs-lint:
    name: Docs lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docs/reported/README.md lists exactly the open reports
        run: bash tests/check-reported-index.sh
      - name: r7rs guide SRFI list matches the prelude
        run: bash tests/check-r7rs-srfi-sync.sh

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Several jobs per OS, split along ctest boundaries: `fixtures` runs the
    # RUN_SERIAL tur_tests corpus, `r7rs` runs every suite whose name contains
    # `r7rs`, `fconv` and `gsm1`/`gsm2` run the two expensive serial suites
    # (Linux only -- see the matrix `exclude` below), and `aux` runs the ~159
    # that are left, all but `fixtures` under -j.  They only share the build,
    # which ccache reproduces in about a minute, and running them in parallel
    # takes the macOS leg from ~23 min (8.5 fixture + 12 auxiliary, back to
    # back) to the longer of the parts.
    # The fixtures part keeps the "Test (<os>)" check name so
    # required-status-check rules keep matching it.
    #
    # `r7rs` became its own part because the dialect's suites are RUN_SERIAL
    # where they fan out internally (tur_r7rs_gc, tur_r7rs_sanitize), and a
    # RUN_SERIAL test is a barrier on ctest's scheduler: nothing runs beside
    # it.  Between 09-19 and 09-29 the macOS aux job's serial chain went from
    # 3.8 min to 18.3 min as those suites landed, and total wall time from
    # ~22 min to ~36 min -- growth that lands entirely on the critical path
    # and cannot be recovered by -j.  That split gave r7rs its own ~10 min.
    #
    # The same mechanism then did it again, one layer down, and the budget this
    # comment used to quote ("~13 min" for aux, measured 09-28..09-30) was
    # already stale when it was written: tur_generic_spec_matrix and
    # tur_emitted_float_conversions were registered on 09-30 and took the macOS
    # aux job from 18m12s to 67m28s in ONE merge (#1007, 8bb60d016).  Both are
    # RUN_SERIAL for the same reason as the r7rs pair, and together they were
    # 70% of the job.  `fconv` and `gsm1`/`gsm2` are the answer, and the leg
    # asymmetry below is the rest of it.  PROJECTED from the pre-change
    # measurements, not yet observed: macOS aux 66 -> ~27 min, Linux aux
    # ~15 min with the two suites moved out.  Check them against the real trend
    # (branch `ci-metrics`, suite-timings-2026.jsonl) once this has run a few
    # times, and correct this comment to measured numbers then -- the "~13 min"
    # that used to be here was measured, and went stale in two days anyway, so
    # a number in this comment is worth only as much as its date.
    #
    # The parts must between them run every registered test, and that is no
    # longer something to verify by hand: every pattern below comes from
    # tests/ctest-parts.py, and the `tur_ctest_partition` suite asserts against
    # `ctest -N` that the table is complete and disjoint on BOTH legs.  Add a
    # suite, or change a part, and that test says whether the split still holds
    # -- edit the table, never a pattern inline here.  Every part also carries
    # `--no-tests=error`, so a drift that empties one fails the job instead of
    # passing it vacuously.
    name: ${{ matrix.job_name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # This job had NO timeout-minutes and so inherited GitHub's 360-minute
    # default, which is why a 67-minute macOS aux job passed quietly instead of
    # saying anything.  A number here is a diagnostic, not a budget.
    #
    # 90, against a projected ~27 min for the slowest part (macOS aux) plus a
    # cold-cache build: deliberately loose, because a timeout-minutes kill is the
    # one outcome with NO diagnostics -- it cancels the job and leaves the
    # `if: always()` timing uploads pending, so a run killed here tells you less
    # than the slow run it replaced.  ctest's own per-test TIMEOUT properties are
    # the tight bound and they name the suite; this is only the outer fence.
    # Tighten it once the post-split durations are in the trend, not before.
    timeout-minutes: 90
    # tur-link-and-build-split-plan Phase 5: cache the compiler-build objects
    # across runs. ccache launches every `cc -c` in the cmake build of `tur`
    # (main.c + the runtime/compiler TUs), so an unchanged TU is a cache hit --
    # the bulk of each job's build step. (Fixture builds see little benefit now:
    # the auto/runtime-lib default already skips the runtime recompile, and each
    # fixture's generated .c is unique and invalidated by any src/ change.)
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      # Don't hash the build dir, and rewrite absolute paths under the workspace
      # to relative, so the -g Debug build's embedded paths don't defeat cross-run
      # hits (mirrors CCACHE_NOHASHDIR in tests/run.sh).
      CCACHE_NOHASHDIR: "1"
      CCACHE_BASEDIR: ${{ github.workspace }}
      # Which leg's part table the ctest steps read from tests/ctest-parts.py.
      # `matrix`, not `runner`: the runner context is NOT available in a
      # job-level env block, and `${{ runner.os }}` here would expand to the
      # empty string rather than erroring -- silently handing both legs the same
      # wrong part patterns.
      TUR_CI_LEG: ${{ startsWith(matrix.os, 'macos') && 'macos' || 'linux' }}
      # gsm1/gsm2 are one sharded test per job, so the job IS that shard and its
      # timing row should say so.  Set at JOB level, not on the ctest step: the
      # collect step is a different step and would not see a step-level value,
      # which is the whole point of setting it.  Empty for every other part.
      TUR_TEST_SHARD: ${{ matrix.gsm_shard }}
      # The matrix's own cell slice.  gsm1/gsm2 take it from the matrix.  The
      # macOS `aux` part takes 1/4 -- per-PR macOS runs a quarter of the cells
      # and the nightly arm64 leg runs them all, which keeps arm64 coverage of
      # an ABI-sensitive bug class without adding a macOS job (see the matrix
      # `exclude` comment).  A quarter is an unbiased 25% sample of every
      # producer x sink x type, and this family's regressions hit whole rows or
      # columns rather than isolated cells, so a quarter catches them on the PR.
      TUR_GSM_SHARD: ${{ matrix.gsm_shard || (startsWith(matrix.os, 'macos') && matrix.part == 'aux' && '1/4') || '' }}
      # Same shape, same reason, for the interpreter pass over the fixture
      # corpus: 283s on macOS and -- with the matrix sharded -- the last
      # RUN_SERIAL barrier left in `aux`.  The compiled path already runs the
      # same corpus in full on both legs, so a second macOS engine pass over all
      # of it is the lowest-value serial time in the job.  A quarter per PR, all
      # of it on the nightly arm64 leg.  run-turi.sh reads THIS variable and
      # deliberately ignores TUR_TEST_SHARD (tests/run-shard-partition.sh
      # asserts that), so sampling it cannot touch the 160 other aux suites.
      TUR_TURI_SHARD: ${{ (startsWith(matrix.os, 'macos') && matrix.part == 'aux') && '1/4' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        part: [fixtures, aux, r7rs, fconv, gsm1, gsm2]
        exclude:
          # The two extra parts are LINUX ONLY, and the reason is the macOS
          # runner POOL, not macOS CPU.  Measured over two runs on 2026-10-01:
          # every ubuntu and Windows job in a run starts at t+0, while the five
          # macOS jobs start at t+40..t+80 min and never more than 2-3 at once
          # -- and the first 40 minutes cannot be a concurrency limit, because
          # nothing of ours is running yet.  The repo is public, so this is pool
          # scarcity.  So splitting a serial barrier into more jobs is the right
          # move on Linux, where jobs are free and immediate, and the wrong one
          # on macOS, where a fourth job queues behind the first three and
          # leaves total occupancy unchanged.  macOS gets LESS WORK instead
          # (TUR_GSM_SHARD on its aux step, below).
          - os: macos-latest
            part: fconv
          - os: macos-latest
            part: gsm1
          - os: macos-latest
            part: gsm2
        include:
          # ctest_part names the row in tests/ctest-parts.py to take the pattern
          # from; it differs from `part` only where one ctest test is split
          # across several jobs.
          - part: fixtures
            job_name: Test
            ctest_part: fixtures
          - part: aux
            job_name: Auxiliary suites
            ctest_part: aux
          - part: r7rs
            job_name: R7RS suites
            ctest_part: r7rs
          - part: fconv
            job_name: Float conversions
            ctest_part: fconv
          # Two jobs over one ctest test: tur_generic_spec_matrix is 4066 live
          # cells at ~1.5s of CPU each and is RUN_SERIAL (it fans out
          # internally), so it was 51% of the aux job's wall clock on its own.
          # TUR_GSM_SHARD slices the CELLS; the two shards together run the
          # whole matrix.  A third shard buys nothing -- the remaining aux part
          # becomes the floor at two.
          - part: gsm1
            job_name: Generic spec matrix 1/2
            ctest_part: gsm
            gsm_shard: 1/2
          - part: gsm2
            job_name: Generic spec matrix 2/2
            ctest_part: gsm
            gsm_shard: 2/2
        # Sharding the fixture corpus itself is still off, but the blockers
        # that kept it off are not blockers any more.  run.sh has always
        # supported it (TUR_TEST_SHARD="i/N" partitions round-robin by fixture
        # ordinal, so shards are balanced and their union is the full corpus),
        # and the `fixtures` part is where a shard axis would go.  What was
        # missing was the timing trend: every shard publishes a `tur_tests` row
        # for the same run and environment, and the /ci aggregates assumed one
        # row per suite per run.  They no longer do -- a row now carries
        # shard_index/shard_total (tools/ci/collect-suite-timings.py, null when
        # unsharded) and the dashboard keys each slice as its own series
        # (`seriesName` in web/ci-metrics.js).
        #
        # So what is left before adding e.g. `fixtures 1/2` / `fixtures 2/2`
        # here is a gating decision, not plumbing: a shard axis renames the
        # check to `Test (<os>) 1/2`, and any branch-protection rule requiring
        # the current name has to move in the same change.  That is the reason
        # this job kept the `Test (<os>)` name in the first place.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # The runner image ships a Google Chrome apt source that has served a
          # stale index ("Hash Sum mismatch") and killed every Linux job of a
          # main push before any step of ours ran (0dca9811, 2026-09-09).
          # Nothing here needs it: drop it before updating, and retry the
          # update once in case the Ubuntu mirrors are mid-sync as well.
          # gdb: the native-backtrace half of tur_phase4_gdb and the DWARF /
          # pretty-printer half of tur_phase5_gdb had never run on a hosted
          # runner (docs/reported/ci-suites-that-never-run-on-hosted-runners.md).
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update || { sleep 20; sudo apt-get update; }
          sudo apt-get install -y libedit-dev ccache gdb

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        # coreutils is for `gtimeout`, and it is load-bearing, not a nicety.
        # Stock macOS ships no `timeout(1)`; both tests/run.sh and
        # tests/run-jit.sh detect `timeout` then `gtimeout` and, finding
        # NEITHER, run every fixture UNTIMED -- a tradeoff their own comments
        # spell out ("a hung fixture then hangs the run").  On this runner that
        # turned one flaky networking fixture into a 45-minute job kill with no
        # FAIL line, three times on 2026-08-02.  With gtimeout present the same
        # fixture dies at its per-fixture timeout and reports as a FAIL, which
        # is a result you can act on.
        run: |
          brew install libedit ccache coreutils || true
          # pyyaml: tests/run-tutorial-quickstart.sh (tur_tutorial_steps) skipped
          # on every macOS run for want of it, so the tutorial steps were only
          # ever asserted on Linux.  Non-fatal on purpose: if neither form
          # installs, the harness still skips honestly rather than failing here.
          # C-5: pinned to an exact version.  Version only, not a digest: this
          # is an inline install with no requirements file to carry hashes,
          # PyYAML ships a per-platform wheel matrix that would need all of
          # them, and unlike tools/requirements.txt nothing here reaches a
          # released artifact -- it is a test harness dependency on one leg.
          python3 -m pip install 'pyyaml==6.0.3' || python3 -m pip install --break-system-packages 'pyyaml==6.0.3' || true

      # Restore + explicit save (not the combined cache action): the combined
      # action's post-save defaults to save-always:false, so it would skip
      # saving whenever a later step -- e.g. the fixture suite below -- fails,
      # exactly the runs where the freshly-built ccache is most worth keeping.
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-${{ runner.os }}-${{ matrix.part }}-${{ github.sha }}
          restore-keys: |
            ccache-test-${{ runner.os }}-

      # The DEFAULT configuration, which carries the MIR JIT engine since
      # TUR_JIT defaulted ON (2026-10-02) -- so these parts test what ships.
      # The two engine-only suites that registers are run by the `jit` job, not
      # here (tests/ctest-parts.py OTHER_JOB).
      - name: Configure (Debug + ASAN)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j

      - name: ccache stats
        run: ccache -s

      # emcc and node are what tests/run-refine-wasm.sh (tur_refine_wasm)
      # needs; it skipped on every run of this job on both OSes.  Placed
      # AFTER Build on purpose: TUR_WASM is off here, so configure never
      # looks for emcc, and the harness only needs it on PATH at test time.
      - name: Set up Emscripten (for tur_refine_wasm)
        if: matrix.part == 'aux'
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          # C-5: an exact SDK version, not `latest`.  This is what `latest`
          # resolved to when the pin was taken, so behaviour is unchanged --
          # what changes is that a toolchain bump now shows up as a diff
          # rather than as yesterday's green run going red for no reason.
          version: 6.0.10
          actions-cache-folder: 'emsdk-cache'

      # The sibling checkout that tur_scscm_compile and the requires.spices
      # fixtures (three today) key on; without it every one of them skipped
      # on every run.  Shallow, at the sibling's default branch -- the same
      # thing a developer following CLAUDE.md's "Optional dependencies" gets.
      #
      # Prefer /usr/bin/git over whatever PATH resolves first. The macos-latest
      # image currently ships a Homebrew git (2.55.0) linked against a
      # libintl.8.dylib its own gettext (1.0) no longer provides, and
      # /opt/homebrew/bin precedes /usr/bin -- so the bare name finds a binary
      # that SIGABRTs in dyld before it opens a connection (exit 134), and the
      # step fails identically on every re-run. Apple's git is present on the
      # macOS runners and is the same binary the bare name already resolves to
      # on Ubuntu, so this costs nothing there and does not branch on the OS.
      - name: Check out turmeric-spices (sibling)
        run: |
          # An `if`, not `[ -x ... ] && GIT=...`: the step shell is `bash -e`,
          # where that list's own non-zero status on a miss ends the step.
          if [ -x /usr/bin/git ]; then GIT=/usr/bin/git; else GIT=git; fi
          # C-5 asked whether this should be SHA-pinned like the actions above.
          # Deliberately not, and the reason is recorded here rather than left
          # to look like an oversight: turmeric-spices is owned by whoever owns
          # this repo -- `github.repository_owner` below makes that true by
          # construction rather than by convention, and follows a transfer
          # (personal account -> org) with no edit -- so it sits INSIDE the
          # trust boundary `main` already draws, not outside it; pinning it
          # would defend this repo against itself.  A pin would also mean a SHA
          # in this file that some human bumps, which goes stale and then gets
          # bumped blind; see the comment block at the top of cmake/mir.cmake
          # for that failure mode observed in this repo.  Revisit if the spices
          # repo ever takes third-party contributions on its default branch.
          "$GIT" clone --depth 1 \
            "https://github.com/${{ github.repository_owner }}/turmeric-spices" \
            ../turmeric-spices

      - name: Smoke check (tur --version must not hang)
        run: |
          # A fresh `tur --version` returns effectively instantly. If a startup
          # regression ever makes it hang, catch it here under a tight timeout
          # instead of stalling the whole job. `perl -e 'alarm ...'` is the
          # portable timeout that works on both Linux and macOS runners
          # (macOS ships no coreutils `timeout`); SIGALRM terminates the child,
          # so a hang surfaces as a non-zero exit rather than an indefinite wait.
          out=$(perl -e 'alarm 10; exec @ARGV' ./build/tur --version)
          rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::tur --version failed or hung (exit $rc)"
            exit 1
          fi
          case "$out" in
            *"the Turmeric compiler"*) ;;
            *) echo "::error::unexpected tur --version output"; exit 1 ;;
          esac

      # cc-path-preamble-split-plan: the preamble split is the DEFAULT on Linux
      # and Windows, and it FAILS CLOSED.  A hash mismatch, a missing
      # libturt_preamble.a, or any other declined precondition makes a build
      # quietly keep the whole preamble, and every fixture still passes, slower.
      # Without this probe, a tree that lost the split would report green here
      # having run the old path.  Linux only: macOS does not default to the split
      # yet (cc-path-preamble-split-plan, "Left").
      - name: Verify the preamble split engages by default
        if: runner.os == 'Linux' && matrix.part == 'fixtures'
        run: |
          printf '(defn main [] : int 0)\n' > /tmp/splitprobe.tur
          out=$(TUR_SHOW_CC=1 TUR_JIT_TIMING=1 \
                  ./build/tur build /tmp/splitprobe.tur -o /tmp/splitprobe 2>&1) || true
          printf '%s\n' "$out"
          case "$out" in
            *-lturt_preamble*) ;;
            *) echo "::error::a default build did not take the preamble split -- see any 'disengaged' reason above (regenerate src/runtime/generated/ with tools/gen-runtime-split.py after a preamble change)"
               exit 1 ;;
          esac
          /tmp/splitprobe || { echo "::error::split-built binary did not run"; exit 1; }
          echo "the default build takes the split and the artifact runs."

      - name: Run fixture suite
        if: matrix.part == 'fixtures'
        # The whole corpus in one shard -- see the matrix note above for what
        # sharding it further would need first.
        #
        # TUR_SANITIZER_GATE makes a UBSan/ASan finding from `tur` ITSELF fail
        # the run, rather than printing into a log nobody reads. That
        # silent-report mode is how `fat_captures_borrowed` was read
        # uninitialized on 60 fixtures, on every run, for as long as it existed,
        # without anything ever going red
        # (docs/archive/history/fat-captures-borrowed-read-uninitialized.md).
        #
        # Armed on BOTH legs. It was Linux-only for exactly one PR, because the
        # zero-findings measurement behind arming it had only been taken on
        # Linux/GCC and UBSan findings are precisely the class of thing that
        # varies with toolchain -- different struct padding, different
        # uninitialized bytes, different implementation-defined corners. The
        # macOS half has since been measured: 0 findings across 2703 fixtures on
        # macOS 27.0 / Apple clang 21 / arm64, and confirmed to be a REAL zero
        # rather than a broken detector by a positive control (a planted signed
        # overflow in main() is caught, attributed to its fixture and phase, and
        # fails the run). A gate that reports nothing because its pattern does
        # not match the local sanitizer looks exactly like a clean tree, and
        # this gate has already had that failure once -- note_sanitizer was
        # missing from run.sh's `export -f` list.
        #
        # Caveat if this reddens the macOS leg and not a local run: the
        # measurement was taken on a local Apple-silicon Mac, NOT on the
        # `macos-latest` runner image, whose macOS and Xcode versions differ.
        # Same libubsan lineage and architecture, so strong evidence and not a
        # proof. A first finding here is more likely a genuine version-specific
        # one than a broken gate -- read the uploaded sanitizer-findings
        # artifact before assuming otherwise.
        # See docs/archive/sanitizer-gate-not-armed-in-ci.md.
        #
        # --output-junit: per-suite name/status/duration for the timing trend
        # (docs/archive/suite-timing-trends-plan.md).  It writes its OWN file
        # rather than sharing one with the auxiliary step below, because a
        # single path would let that second ctest invocation overwrite this
        # one and silently drop tur_tests -- the most valuable series here.
        # The XML also embeds each test's stdout in <system-out>, even under
        # --output-on-failure, which is where the TUR_SKIP markers are read
        # from; no -V or tee plumbing is needed.
        # --test-output-size-passed / --test-output-truncation: ctest keeps
        # only the first 1 KiB of a PASSING test's output by default (the
        # default truncation mode, "tail", drops the END), so a harness that
        # prints thousands of PASS lines loses its trailing "summary: N
        # passed" line and its TUR_SKIP_PARTIAL marker before they reach
        # <system-out>.  Two weeks of ci-metrics rows carried no counts for
        # tur_tests or turi_fixture_tests for exactly this reason.  256 KiB
        # with "head" truncation keeps the tail, where every harness puts
        # its census.
        env:
          TUR_SANITIZER_GATE: "1"
        run: |
          pattern="$(python3 tests/ctest-parts.py pattern fixtures --leg "$TUR_CI_LEG")"
          ctest --output-on-failure --progress --test-dir build -R "$pattern" --output-junit results-main.xml --test-output-size-passed 262144 --test-output-truncation head

      - name: Run auxiliary suites
        if: matrix.part == 'aux'
        # Everything the other parts do not claim, once per OS, in its own job
        # so it overlaps the fixture corpus instead of following it.
        #
        # -j: this step runs ~160 targets, so without it wall time is their sum.
        # The count must be explicit -- through CMake 3.28 a bare `-j` is
        # accepted silently and does nothing (see the Justfile `test` recipe).
        # getconf _NPROCESSORS_ONLN is portable across the Linux and macOS
        # runners; nproc is GNU-only.
        # Safe for the harnesses that fan out across nproc internally
        # (turi_fixture_tests, tur_jit_fixture_tests) because those ARE marked
        # RUN_SERIAL in CMakeLists.txt, so ctest never co-schedules two of them.
        # Note the repl-spice targets are NOT uniformly RUN_SERIAL -- only
        # reload/watch/jit are; call/load/linklibs run in parallel. They drive a
        # single REPL rather than fanning out, so that is fine, but it does mean
        # they no longer run one-at-a-time: each needs its own leak-detection
        # opt-out for the interpreter's process-lifetime bindings, which they
        # now carry. The step above is a single RUN_SERIAL target, so -j would
        # do nothing there.
        # --output-junit to a DISTINCT path from the step above -- see the note
        # there. Each part writes exactly one results-*.xml; the collect step
        # globs whichever one this part produced.
        #
        # The -E pattern comes from tests/ctest-parts.py, which is also what
        # tur_ctest_partition checks for completeness -- so a pattern and its
        # check can never disagree. The two legs get DIFFERENT patterns: Linux
        # excludes both expensive suites (they have their own parts below),
        # macOS excludes only the float lint and keeps a shard of the matrix
        # here. See the matrix `exclude` comment for why.
        run: |
          pattern="$(python3 tests/ctest-parts.py pattern aux --leg "$TUR_CI_LEG")"
          echo "aux -E pattern ($TUR_CI_LEG): $pattern"
          ctest -j "$(getconf _NPROCESSORS_ONLN)" --output-on-failure --progress --test-dir build -E "$pattern" --no-tests=error --output-junit results-aux.xml --test-output-size-passed 262144 --test-output-truncation head

      - name: Run r7rs suites
        if: matrix.part == 'r7rs'
        # The `#lang r7rs` dialect's own suites, in their own job for the
        # reason in the job comment above: two of them (tur_r7rs_gc,
        # tur_r7rs_sanitize) fan out across nproc internally and so must stay
        # RUN_SERIAL, which on ctest's scheduler is a barrier for the whole
        # invocation.  Keeping them here means they only serialize against
        # each other and the ~160 suites in the `aux` part no longer wait
        # behind them.
        #
        # `-R 'r7rs'` matches the substring, not a prefix, on purpose: it picks
        # up lsp_r7rs_diagnostics and tur_init_r7rs alongside the tur_r7rs_*
        # family, and a suite added later for this dialect lands in this job
        # by its name alone.  That is also why the aux pattern excludes the
        # same substring rather than listing names -- see the complement note
        # in the job comment.
        #
        # No Emscripten step gates on this part: tur_refine_wasm is an `aux`
        # suite, and emsdk setup costs about 100 s.
        run: |
          pattern="$(python3 tests/ctest-parts.py pattern r7rs --leg "$TUR_CI_LEG")"
          ctest -j "$(getconf _NPROCESSORS_ONLN)" --output-on-failure --progress --test-dir build -R "$pattern" --no-tests=error --output-junit results-r7rs.xml --test-output-size-passed 262144 --test-output-truncation head

      - name: Run the float-conversion lint
        if: matrix.part == 'fconv'
        # tur_emitted_float_conversions on its own, Linux only.  613s measured
        # on macOS and 19% of the aux job's wall clock, and like the matrix
        # below it is RUN_SERIAL because it fans out across nproc internally --
        # so inside `aux` it was a barrier, and the two expensive suites were a
        # CHAIN against each other.  That is the thing to understand before
        # reshaping this: pulling both into ONE new part saves only ~16 min of
        # ~66, because they serialize there exactly as they did in `aux`.  A
        # part each is what breaks the chain.
        #
        # No -j: this part is a single RUN_SERIAL target, which fans out on its
        # own, so -j would do nothing.  No Emscripten setup either -- that step
        # gates on `aux` (tur_refine_wasm lives there) and costs ~95s.
        run: |
          pattern="$(python3 tests/ctest-parts.py pattern fconv --leg "$TUR_CI_LEG")"
          ctest --output-on-failure --progress --test-dir build -R "$pattern" --no-tests=error --output-junit results-fconv.xml --test-output-size-passed 262144 --test-output-truncation head

      - name: Run the generic-spec matrix shard
        if: matrix.ctest_part == 'gsm'
        # tur_generic_spec_matrix, half the cells per job, Linux only.  1622s on
        # macOS -- 51% of the aux job's wall clock by itself -- at 4066 live
        # cells x ~1.5s of CPU, where each cell spawns up to five processes
        # (check, a full compile-and-link run, interpret, emit-c, a clang lint).
        # There is no per-cell waste to reclaim; the only lever is how many
        # cells run per job.
        #
        # Both TUR_GSM_SHARD and TUR_TEST_SHARD come from the job env above.
        # TUR_GSM_SHARD is the slice the script honours; TUR_TEST_SHARD exists
        # only so collect-suite-timings.py tags the row, and it is safe here for
        # one reason -- this part runs exactly ONE test, so "the job is that
        # shard" is true of every row it writes.  Do NOT copy it to a part that
        # runs other suites too: it tags rows from the environment, so there it
        # would label all of them as replicas of a slice they never ran.  That
        # case is what the collector's --suite-shard is for.
        run: |
          pattern="$(python3 tests/ctest-parts.py pattern gsm --leg "$TUR_CI_LEG")"
          ctest --output-on-failure --progress --test-dir build -R "$pattern" --no-tests=error --output-junit results-gsm.xml --test-output-size-passed 262144 --test-output-truncation head

      # `always()`, NOT `continue-on-error` on the ctest steps: a suite that
      # regressed into a timeout is exactly the signal this exists to catch, so
      # the timings must be collected on a red run too -- but making the test
      # steps non-fatal to achieve that would turn the repo's main gate green
      # while tests fail. This gets the same data without touching the gate.
      - name: Collect suite timings
        if: always()
        run: |
          # NOTE the build/ prefix: a RELATIVE --output-junit path is resolved
          # against --test-dir, not the working directory, so ctest wrote these
          # into build/. Reading them from the workspace root instead yields
          # zero rows and (because the script only warns) a silently empty
          # dashboard -- which is exactly how this would have shipped broken.
          # A glob, not a list of names: each part runs exactly one of the
          # ctest steps above and so writes exactly one results-*.xml
          # (results-main / -aux / -r7rs / -fconv / -gsm).  Naming them all
          # would make the collector warn about the ones this part never wrote,
          # on every run of every part -- and it is a glob rather than a list
          # for that reason, so a part added later needs no edit here.  If the
          # glob matches nothing -- a ctest step that died before writing -- the
          # literal pattern is passed, the collector warns once, and the
          # empty-file check below reports it.
          # The macOS aux part runs a QUARTER of tur_generic_spec_matrix beside
          # 160 suites that run whole, so the shard belongs to that one row and
          # not to the job.  $TUR_TEST_SHARD would tag all 161; leaving it off
          # entirely would drop the matrix's series ~4x with nothing in the data
          # explaining it.  --suite-shard labels exactly the row that sliced.
          # A plain string, not an array: macOS ships bash 3.2, where an empty
          # "${arr[@]}" is an unbound-variable error the moment anything turns
          # on `set -u`.  Deliberately UNQUOTED below so it splits into two
          # arguments -- the value is a suite name and an i/N, so it carries no
          # spaces and no glob characters.
          suite_shard=
          if [ "${{ matrix.part }}" = aux ] && [ -n "${TUR_GSM_SHARD:-}" ]; then
            suite_shard="--suite-shard tur_generic_spec_matrix=$TUR_GSM_SHARD"
          fi
          if [ "${{ matrix.part }}" = aux ] && [ -n "${TUR_TURI_SHARD:-}" ]; then
            suite_shard="$suite_shard --suite-shard turi_fixture_tests=$TUR_TURI_SHARD"
          fi
          python3 tools/ci/collect-suite-timings.py --build-dir build \
            $suite_shard build/results-*.xml > timings.jsonl || true
          if [ ! -s timings.jsonl ]; then
            echo "::warning::no suite timings collected -- check the ctest --output-junit paths above"
          else
            echo "collected $(wc -l < timings.jsonl) suite rows"
          fi

      - name: Upload suite timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timings-test-${{ matrix.os }}-${{ matrix.part }}
          path: timings.jsonl
          if-no-files-found: warn
          retention-days: 7

      # The gate armed above prints only the ten most common findings to the
      # console; the per-fixture attribution for ALL of them is in this file.
      # Without it a red gate on a toolchain that is not to hand -- which, given
      # the whole reason this took a macOS measurement, is the likely case --
      # says "N findings" and nothing about where. `if-no-files-found: ignore`
      # because a green run writes no such file, which is the normal outcome.
      - name: Upload compiler sanitizer findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitizer-findings-${{ matrix.os }}-${{ matrix.part }}
          path: build/sanitizer-findings.log
          if-no-files-found: ignore
          retention-days: 7

      # Save after everything (incl. the fixture suite, which also feeds ccache
      # via run.sh) regardless of whether the suite passed. The exact key never
      # pre-exists (it embeds the commit SHA), so this always writes a fresh entry.
      #
      # Only the three ORIGINAL parts save. Every part builds the same `tur` with
      # the same flags, and -- per the note above -- no part's exact key ever
      # pre-exists, so each one's restore is always a `restore-keys` prefix hit on
      # some OTHER part or run. A part's own saved cache is therefore only ever
      # read through that prefix, which means three near-identical copies per OS
      # per sha already serve every part; `fconv` and the two `gsm` jobs saving
      # three MORE would add 50% to this job's cache entries (6 -> 9 per run) and
      # buy nothing but eviction pressure against the repo's 10 GB budget, at up
      # to 500 MB each. They still RESTORE, so their builds stay warm.
      - name: Save ccache
        if: always() && (matrix.part == 'fixtures' || matrix.part == 'aux' || matrix.part == 'r7rs')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-${{ runner.os }}-${{ matrix.part }}-${{ github.sha }}

  jit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: JIT engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The MIR JIT engine had NO CI coverage at all until this job: the `test`
    # job configured without -DTUR_JIT=ON, so `tur_jit_fixture_tests` and
    # `tur_repl_spice_jit` never registered (CMakeLists.txt gates both on
    # TUR_JIT) and the whole engine shipped untested on every platform.  Every
    # macOS JIT number in docs/upcoming/jit-engine-j0-findings.md was
    # hand-measured on someone's laptop as a result.
    #
    # TUR_JIT has defaulted ON since 2026-10-02 (MIR is vendored under
    # external/mir/), so the `test` job builds the engine too and registers
    # both suites.  It still does not RUN them: tests/ctest-parts.py lists them
    # in OTHER_JOB, which names this job, and its --check reads this job's -R
    # pattern below to confirm the claim.  So the engine's corpus runs here and
    # only here, for these reasons:
    #   1. (Retired 2026-10-02.)  TUR_JIT used to make configure clone MIR over
    #      the network, and folding that into the main gate would have made a
    #      GitHub/network blip fail every PR.  The vendored copy ended that.
    #   2. tur_jit_fixture_tests re-runs the whole ~2500-fixture corpus through
    #      the engine.  It is fast (~2 min on Apple Silicon, run serially and
    #      fanned out internally), but it is a second full corpus pass and
    #      belongs on its own clock.
    #   2b. It is also the slowest leg in the matrix, and the reason is runner
    #      size rather than anything about the engine.  `macos-latest` hands
    #      out both 3-core and 5-core machines; measured off the ci-metrics
    #      branch, tur_jit_fixture_tests runs ~440s median on Linux (4 cores),
    #      ~348s on a 5-core mac and ~730s median / ~940s p90 on a 3-core one,
    #      which is what CI draws ~97% of the time.  Throughput is linear in
    #      cores (the serial suites show the 5-core box is only ~1.2x faster
    #      per core), so raising TUR_TEST_JOBS on a 3-core runner buys nothing
    #      and only risks the per-fixture timeouts CLAUDE.md warns about --
    #      more parallelism here means more MACHINES.  run-jit.sh now honors
    #      TUR_TEST_SHARD="i/N" for exactly that, guarded by the
    #      tur_shard_partition test; adding the axis is the gating decision
    #      described on the `test` job above, not a plumbing one.
    #   3. The `jit` experiment graduated 2026-08-17 and every default build now
    #      carries the engine, but `cc` is still the default ENGINE, so the
    #      programs people run go through the AOT suite's path.  This leg covers
    #      the engine itself, which only `tur jit` / `--engine jit` / the REPL
    #      reach.
    #
    # 60, raised from 45 on 2026-10-01: the whole-ctest alarm below went to
    # 2550s to stay above tur_jit_fixture_tests' raised per-test TIMEOUT, and
    # this has to clear that alarm plus the build and the uploads.  A
    # timeout-minutes kill is the one outcome with NO diagnostics (it cancels
    # the job and leaves the `if: always()` uploads pending), so it stays the
    # outermost bound by a wide margin.
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_NOHASHDIR: "1"
      CCACHE_BASEDIR: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # Drop the runner image's Google Chrome apt source and retry the
          # update once -- see the `test` job's dependency step for why.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update || { sleep 20; sudo apt-get update; }
          sudo apt-get install -y libedit-dev ccache

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        # coreutils is for `gtimeout`, and it is load-bearing, not a nicety.
        # Stock macOS ships no `timeout(1)`; both tests/run.sh and
        # tests/run-jit.sh detect `timeout` then `gtimeout` and, finding
        # NEITHER, run every fixture UNTIMED -- a tradeoff their own comments
        # spell out ("a hung fixture then hangs the run").  On this runner that
        # turned one flaky networking fixture into a 45-minute job kill with no
        # FAIL line, three times on 2026-08-02.  With gtimeout present the same
        # fixture dies at its per-fixture timeout and reports as a FAIL, which
        # is a result you can act on.
        run: brew install libedit ccache coreutils || true

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-jit-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-jit-${{ runner.os }}-

      # -DTUR_JIT=ON although it is the default: this job exists to run the
      # engine, so it must not follow the default if that ever moves.
      - name: Configure (Debug + JIT)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTUR_JIT=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_C_COMPILER_LAUNCHER=ccache

      # ALL targets, not `--target tur`: the engine's step-6 cc fallback links
      # -lturi, and `tur` itself never links turi, so a tur-only build leaves
      # every fallback fixture dying with `ld: library 'turi' not found`.
      # (CLAUDE.md records this exact trap.)
      - name: Build (all targets -- the cc fallback links libturi.a)
        run: cmake --build build -j

      # Load-bearing: tests/run-jit.sh probes the binary for the engine and
      # SKIPs the entire corpus with exit 0 when it is absent.  That is the
      # right behaviour for a local build, but in CI it means a job that
      # silently lost -DTUR_JIT=ON would report GREEN having run nothing --
      # precisely the failure mode that let this gap persist.  Fail loudly
      # instead.  `perl -e alarm` is the portable timeout (macOS runners ship
      # no coreutils `timeout`), matching the smoke check in the `test` job.
      # Needs a real file: a bare `tur jit` prints "usage: tur jit" whether or
      # not the engine is compiled in, so matching on the usage line passed a
      # no-JIT build too.  Only an engine-less build prints "carries no JIT
      # engine"; a real one runs the probe.
      - name: Verify the JIT engine is actually present
        run: |
          printf '(defn main [] : int (do (println "jit-ok") 0))\n' > /tmp/jit-probe.tur
          out=$(perl -e 'alarm 30; exec @ARGV' ./build/tur jit /tmp/jit-probe.tur 2>&1) || true
          echo "$out"
          case "$out" in
            *"jit-ok"*)
              echo "JIT engine present." ;;
            *)
              echo "::error::tur was built without the MIR JIT engine -- the JIT suites would self-skip and this job would pass vacuously."
              exit 1 ;;
          esac

      # The S2 split-runtime path engages only when the preamble the JIT probe
      # emits hashes equal to the committed src/runtime/generated/tur_rt_split*
      # artifacts.  On a mismatch it does not error -- it silently falls back to
      # the whole-preamble path, so the JIT keeps working, slower, and nothing
      # says so.
      #
      # That has now happened TWICE, both times undetected until someone went
      # looking for an unrelated bug: emit_rt_split_source forces a set of gates
      # to a canonical posture, and each time a NEW gate was added elsewhere
      # without being added to that set (the rc/GC archive flag, then
      # g_trail_autoloaded).  Each divergence disabled the fast path on every
      # platform.
      #
      # Cheap to detect and impossible to notice by hand, so detect it here.
      - name: Verify the S2 split path actually engages
        run: |
          cat > /tmp/s2probe.tur <<'EOF'
          (defn main [] : int 0)
          EOF
          out=$(TUR_JIT_SPLIT_DEBUG=1 perl -e 'alarm 120; exec @ARGV' \
                  ./build/tur jit /tmp/s2probe.tur 2>&1) || true
          line=$(printf '%s\n' "$out" | grep -m1 '^split-debug:' || true)
          if [ -z "$line" ]; then
            printf '%s\n' "$out"
            echo "::error::no split-debug line -- the engage probe did not run; TUR_JIT_SPLIT_DEBUG may have been removed"
            exit 1
          fi
          echo "$line"
          probe=$(printf '%s\n' "$line" | sed -n 's/.*probe=\([0-9a-f]*\).*/\1/p')
          committed=$(printf '%s\n' "$line" | sed -n 's/.*committed=\([0-9a-f]*\).*/\1/p')
          if [ -z "$probe" ] || [ -z "$committed" ]; then
            echo "::error::could not parse probe/committed hashes out of: $line"
            exit 1
          fi
          if [ "$probe" != "$committed" ]; then
            echo "::error::S2 disengaged: probe=$probe committed=$committed. Either regenerate src/runtime/generated/ (tools/gen-runtime-split.py), or -- if the artifacts are already current -- a gate reachable from the JIT probe is missing from the forced set in emit_rt_split_source."
            exit 1
          fi
          echo "S2 engages (probe == committed == $probe)."

      # BLOCKING on macOS, non-blocking on Linux -- deliberately asymmetric,
      # by evidence rather than by preference:
      #
      #   macOS: verified green on arm64 (Apple clang 21, macOS 27) --
      #     2416 passed, 0 failed, 48 skipped (17 via the cc fallback), measured
      #     2026-08-01 in THIS JOB'S OWN CONFIGURATION (Debug + -DTUR_JIT=ON,
      #     TUR_DEBUG_SANITIZE at its default ON).  A green baseline exists, so
      #     the leg gates.  This is also the leg that matters most: macOS is
      #     where the engine's platform-specific hazards live (MAP_JIT/W^X, the
      #     AAPCS64 __uint128_t alignment skew, the Apple-SDK-header cc
      #     fallbacks).
      #
      #     Re-measure IN THIS CONFIGURATION when you update these numbers.  The
      #     previous baseline (2414 / 47 skipped / 31 fallback) was taken on an
      #     unsanitized local build, and that mismatch is exactly why the leg
      #     read red-for-months against a "known green" figure: six GC/Rc/weak
      #     fixtures asserted on a process-wide malloc probe that ASan and
      #     one-process `tur jit` both perturb.  See
      #     docs/archive/jit-macos-gc-rc-weak-fixtures-fail.md.  A local
      #     `-DTUR_DEBUG_SANITIZE=OFF` or Release build will NOT reproduce this
      #     job.
      #
      #   Linux: NOT verified locally when this job was written, so it runs and
      #     publishes its counts without gating.
      #
      # FLIP LINUX TO BLOCKING (drop the matrix condition, leaving no
      # continue-on-error) as soon as the first run publishes a clean ubuntu
      # leg.  Do not let this sit asymmetric indefinitely.
      #
      #   The precondition is MET: run 30685603734 published a clean ubuntu leg
      #   (ctest target passing outright, not continue-on-error hiding it).  The
      #   flip is a gating-policy change and is deliberately left to a human.
      #   One caveat worth knowing before making it: that green was PARTLY
      #   VACUOUS on the GC/Rc/weak family, because the malloc probe those
      #   fixtures used is `mallinfo2`, which reports ~nothing once ASan
      #   replaces glibc's allocator.  As of 2026-08-01 they assert on the CG6
      #   collector counters instead, so the Linux leg's green now means
      #   something there too -- which makes the flip more worthwhile, not less.
      - name: Run JIT suites
        continue-on-error: ${{ matrix.os != 'macos-latest' }}
        shell: bash
        run: |
          # `-V` rather than `--output-on-failure`, so the harness's own counts
          # reach the log on a PASSING run too.
          #
          # This is not cosmetic.  Under --output-on-failure a green run prints
          # nothing but ctest's own "100% tests passed", so the corpus counts
          # are unobservable from CI -- and the baseline documented above can
          # only ever be checked by running the suite by hand.  That is exactly
          # how it drifted: 2414 / 47 skipped / 31 fallback, hand-measured on an
          # unsanitized local build, against a job that builds sanitized.  The
          # numbers disagreed for months and nothing surfaced it.
          #
          # -V alone would dump ~2500 PASS lines per leg, so the output is
          # filtered to what is worth reading -- about 20 lines: each harness's
          # summary, every FAIL line, ctest's own verdict, and the cc-fallback
          # fixtures BY NAME (two archived JIT reports track exactly which
          # fixtures fall back, and the count alone does not say which moved).
          #
          # STREAMED, not redirected-then-filtered.  This step used to do
          # `ctest > jit-ctest.log` and run the grep afterwards, which is fine
          # for a run that finishes and useless for one that does not: when the
          # job hits `timeout-minutes: 60` ctest is killed, the grep never runs,
          # and the log dies with the runner -- so a HANG printed literally
          # nothing and there was no way to tell how far it got.  That is not
          # hypothetical; it is how both `main` (f865097db, 2026-08-02 19:52)
          # and a PR leg burned 45 minutes each with zero diagnostic output.
          # `tee` keeps the full log on disk as it goes (so the artifact below
          # survives a kill) and `grep --line-buffered` emits each interesting
          # line as it appears.
          #
          # `Start <n>: <name>` lines are in the filter so a hang says WHICH
          # ctest test it is inside.  That is coarse -- one ctest test is a
          # whole ~2500-fixture harness run -- so per-fixture resolution comes
          # from the uploaded artifact, not from the console.
          #
          # ctest's status is taken from PIPESTATUS[0], so neither the grep's
          # exit code (1 when nothing matches) nor the pipe can mask a failing
          # suite -- the property the old `rc=$?`-before-grep ordering had, kept
          # across the change to a pipeline.
          #
          # --no-tests=error because a `-R` that matches NOTHING exits 0.  The
          # "Verify the JIT engine is actually present" step above catches the
          # main way that happens (a build that silently lost -DTUR_JIT=ON), but
          # any other break in test registration would sail through as a green
          # step that ran no tests -- the same vacuous-pass shape that step
          # exists to prevent.
          # tur_flags_tests is here as well as in the `test` job, and the
          # duplication is the point: it is the only harness carrying the
          # `jit-ffi-*` cases, and EVERY one of them is gated on the engine
          # being present (`HAS_JIT`), so in the `test` job -- which builds
          # without -DTUR_JIT=ON -- they all SKIP.  Before this line nothing
          # in CI ran run-flags.sh against a JIT build on any runner, which
          # meant the interpreter's whole dynamic-FFI surface (call-ptr,
          # thunk-backed extern-c, callbacks, struct-by-value) was asserted
          # only by hand.  The aarch64 HFA refusal in particular is
          # `#if defined(__aarch64__)` and had NEVER executed anywhere: this
          # macOS leg is the only arm64 machine in the matrix, so this line
          # is what turns that case from documentation into a test.
          #
          # --output-junit rides along for the suite-timing trend
          # (docs/archive/suite-timing-trends-plan.md).  These rows carry
          # jit=true from the build cache, so they form their own series and
          # are never averaged against the `test` job's jit=false rows.
          #
          # macos-jit-hang-loses-both-diagnostics: BOUNDED INSIDE THE JOB
          # BUDGET, which is the whole reason the instrumentation above finally
          # produces something.  On 2026-09-28 this step hung and was killed by
          # `timeout-minutes: 60` -- and a timeout-minutes kill does NOT run the
          # job's remaining `if: always()` steps, so "Upload JIT ctest log"
          # never ran, the runner took the log with it, and the occurrence was
          # as blind as the ones the tee/grep were added for.  The `if:
          # always()` claim had only ever been exercised on a run that
          # SUCCEEDED.
          #
          # 42.5 minutes, against an 18-22 min baseline for this step on recent
          # `main` runs: comfortably above any observed run, and ~17 minutes
          # inside the 60 so the uploads below get to run on a step that FAILS
          # rather than a job that is killed.  It must also stay ABOVE the
          # per-test TIMEOUT properties in CMakeLists.txt (2400s for
          # tur_jit_fixture_tests, raised 2026-10-01 with this) -- only those
          # name the offending target, so an alarm that fires first destroys
          # the diagnostic.  `perl -e alarm` rather than
          # `timeout`, because stock macOS ships no coreutils `timeout` -- the
          # same idiom as the engine-present probe above.  It heads the
          # pipeline, so PIPESTATUS[0] carries its 142 (128+SIGALRM) and the
          # step fails; `tee` has already written everything it got.
          set +e
          perl -e 'alarm 2550; exec @ARGV' \
            ctest --test-dir build -V --no-tests=error --output-junit results-jit.xml \
                --test-output-size-passed 262144 --test-output-truncation head \
                -R '^(tur_jit_fixture_tests|tur_repl_spice_jit|tur_flags_tests)$' 2>&1 \
            | tee jit-ctest.log \
            | grep --line-buffered -aE '^[0-9]+: (FAIL|.*passed,|.*fallback)|^ *Start +[0-9]+:|[0-9]+% tests passed|\*\*\*|Errors while running CTest'
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 142 ]; then
            echo "::error::Run JIT suites exceeded its 42.5-minute budget and was killed. The partial ctest log is uploaded as an artifact by the next step; the per-test TIMEOUT properties in CMakeLists.txt should normally name the test first."
          fi
          exit $rc

      # `always()` covers a FAILING step, which is what the alarm above turns a
      # hang into.  It does NOT cover a `timeout-minutes` kill: that cancels the
      # job and leaves every remaining step `pending`, which is exactly how the
      # 2026-09-28 hang lost its log
      # (docs/archive/macos-jit-hang-loses-both-diagnostics.md).  So this step
      # depends on the step above bounding itself, not on `always()` alone.
      - name: Upload JIT ctest log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-ctest-log-${{ matrix.os }}
          path: jit-ctest.log
          if-no-files-found: warn

      - name: Collect suite timings
        if: always()
        run: |
          # build/ prefix: a relative --output-junit path resolves against
          # --test-dir. See the same note in the `test` job.
          python3 tools/ci/collect-suite-timings.py --build-dir build \
            build/results-jit.xml > timings.jsonl || true
          if [ ! -s timings.jsonl ]; then
            echo "::warning::no suite timings collected -- check the ctest --output-junit paths above"
          else
            echo "collected $(wc -l < timings.jsonl) suite rows"
          fi

      - name: Upload suite timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timings-jit-${{ matrix.os }}
          path: timings.jsonl
          if-no-files-found: warn
          retention-days: 7

      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-jit-${{ runner.os }}-${{ github.sha }}

  # The interpreter in the configuration that has no JIT to lean on.
  #
  # TUR_JIT defaulted ON on 2026-10-02, and from then on every leg above built
  # with the MIR engine -- so nothing compiled or ran the interpreter the way a
  # no-JIT platform gets it.  That is not hypothetical: iOS forbids a JIT and
  # the WASM web REPL has none, and on both the tree-walking interpreter
  # (src/turi/) is the only engine.  A turi change that quietly leans on
  # TUR_HAVE_JIT (the c2mir FFI thunks, the C1 inline-C hook) passes every
  # other leg and only breaks there.  See
  # docs/reported/turi-ios-readiness-unverified.md.
  #
  # Linux only and per PR: Linux runners start immediately (see the `test`
  # matrix `exclude` comment), and a JIT dependency is cheapest to catch the
  # day it lands.  The iOS cross-compile half of the same concern is nightly,
  # in nightly-ios.yml, because it needs a macOS runner.
  #
  # Runs tests/run-turi.sh directly, not through ctest, so this job adds no row
  # to tests/ctest-parts.py: the `test` job still owns turi_fixture_tests, and
  # this is a second configuration of it, not a part of the partition.
  interp-nojit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Interpreter without JIT (ubuntu-latest)
    runs-on: ubuntu-latest
    # The suite measures ~5 min; 60 leaves room for a cold-cache build and is a
    # diagnostic, not a budget (same reasoning as the `test` job's number).
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_NOHASHDIR: "1"
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update || { sleep 20; sudo apt-get update; }
          sudo apt-get install -y libedit-dev ccache

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-nojit-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-nojit-${{ runner.os }}-

      - name: Configure (Debug, JIT off)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTUR_JIT=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_C_COMPILER_LAUNCHER=ccache

      # ALL targets: fixtures that fall back to the cc path link libturi.a,
      # which `--target tur` does not build.
      - name: Build
        run: cmake --build build -j

      # The inverse of the `jit` job's presence check.  If -DTUR_JIT=OFF were
      # ever dropped or overridden, this job would quietly become a second copy
      # of the `test` job's turi run and report green having tested nothing new.
      # Needs a real file: a bare `tur jit` prints its usage line whether or
      # not the engine is compiled in.
      - name: Verify the JIT engine is absent
        run: |
          printf '(defn main [] : int (do (println "hi") 0))\n' > /tmp/nojit-probe.tur
          out=$(perl -e 'alarm 30; exec @ARGV' ./build/tur jit /tmp/nojit-probe.tur 2>&1) || true
          echo "$out"
          case "$out" in
            *"carries no JIT engine"*)
              echo "JIT engine absent, as intended." ;;
            *)
              echo "::error::this build carries the MIR JIT engine -- the no-JIT interpreter configuration is not what ran."
              exit 1 ;;
          esac

      - name: Interpreter fixture suite (run-turi.sh)
        run: |
          set -o pipefail
          timeout 720 bash tests/run-turi.sh 2>&1 | tee turi.log

      # Skips are where interpreter gaps hide (fixtures with user inline-C are
      # skipped outright), so record the count where a reader will see it.
      - name: Record the skip count
        if: always()
        run: |
          line=$(grep -E '^turi fixture summary: ' turi.log | tail -1 || true)
          echo "${line:-no summary line -- the suite did not finish}"
          { echo "### Interpreter without JIT"; echo; echo "${line:-no summary line -- the suite did not finish}"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-nojit-${{ runner.os }}-${{ github.sha }}

  # cc-path-preamble-split-plan: run the corpus with the WHOLE preamble.
  #
  # This job used to be `split`, running the suite under TUR_RUNTIME=split when
  # the split was opt-in.  The split is now the default on Linux and Windows, so
  # `test` and `windows` run it, and this job covers the path the default left
  # behind: every program compiling the runtime preamble inline.  That path is
  # not dead.  A `--target tur` build has no libturt_preamble.a, sanitizer and
  # --debug builds keep the preamble inline on purpose, and an install without
  # the archive falls back to it -- all silently, because the fallback is the
  # correct answer, not a degraded one.  Nothing else on Linux/gcc compiles it.
  #
  # Linux only: macOS still defaults to the whole preamble, so its `test` legs
  # cover it there.
  whole-preamble:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Whole runtime preamble (cc path)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_NOHASHDIR: "1"
      CCACHE_BASEDIR: ${{ github.workspace }}
      TUR_PREAMBLE_SPLIT: "0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          # Drop the runner image's Google Chrome apt source and retry the
          # update once -- see the `test` job's dependency step for why.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update || { sleep 20; sudo apt-get update; }
          sudo apt-get install -y libedit-dev ccache

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-whole-preamble-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-whole-preamble-${{ runner.os }}-

      # Debug, matching the `test` job: a Release tur elides contract checks,
      # so contract fixtures fail with the wrong error and this job would be
      # measuring the build type rather than the preamble.
      - name: Configure (Debug)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_C_COMPILER_LAUNCHER=ccache

      # ALL targets, so libturt_preamble.a IS present and the probe below shows
      # TUR_PREAMBLE_SPLIT=0 is what turns the split off -- not a missing file.
      - name: Build (all targets)
        run: cmake --build build -j

      # The mirror image of the `test` job's engage probe.  If the opt-out
      # stopped working, this job would quietly run the split a second time
      # and report green for a path it never took.
      - name: Verify the split does NOT engage
        run: |
          test -f build/src/libturt_preamble.a || { echo "::error::libturt_preamble.a was not built"; exit 1; }
          printf '(defn main [] : int 0)\n' > /tmp/wholeprobe.tur
          out=$(TUR_SHOW_CC=1 ./build/tur build /tmp/wholeprobe.tur -o /tmp/wholeprobe 2>&1) || true
          printf '%s\n' "$out"
          case "$out" in
            *-lturt_preamble*)
              echo "::error::TUR_PREAMBLE_SPLIT=0 did not keep the whole preamble"
              exit 1 ;;
          esac
          /tmp/wholeprobe || { echo "::error::whole-preamble binary did not run"; exit 1; }
          echo "the whole preamble is compiled inline and the artifact runs."

      - name: Suite with the whole preamble
        run: |
          set -o pipefail
          bash tests/run.sh 2>&1 | tee /tmp/whole-preamble-run.log

      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-whole-preamble-${{ runner.os }}-${{ github.sha }}

  # The fixture corpus under clang's -fsanitize=function (trap mode): every
  # indirect call the emitted C makes must go through a function pointer of
  # EXACTLY the callee's type.  WASM's call_indirect traps on any difference,
  # and on a `double` or a 16-byte `any` the native build answers wrong
  # silently -- the longest-running wrong-answer family this repo has had.
  # The corpus reached zero on 2026-10-02 (docs/archive/
  # emitted-c-indirect-calls-are-not-type-exact.md), so this is a GATE: a
  # failing fixture here is a new mismatched call.  tests/run-fnsan.sh proves
  # the detector armed with a canary first, so it cannot pass vacuously.
  fnsan:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Indirect-call type check (clang -fsanitize=function)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_NOHASHDIR: "1"
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          # Drop the runner image's Google Chrome apt source and retry the
          # update once -- see the `test` job's dependency step for why.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update || { sleep 20; sudo apt-get update; }
          sudo apt-get install -y libedit-dev ccache clang

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-fnsan-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-fnsan-${{ runner.os }}-

      # The compiler under test is the ordinary Debug build (gcc, ASan), as
      # in `test`; only the fixture programs are compiled with clang.
      - name: Configure + build (Debug)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build -j

      # The Debug libturi.a is compiled with gcc's ASan, which clang cannot
      # link against: the fixtures that use it would fail to build and drop
      # out of the count.  An unsanitized one keeps them in.
      - name: Build an unsanitized libturi.a
        run: |
          cmake -S . -B build-nosan -DCMAKE_BUILD_TYPE=Debug -DTUR_DEBUG_SANITIZE=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build-nosan -j --target libturi

      - name: Suite under -fsanitize=function
        run: |
          set -o pipefail
          CC=clang TUR_FNSAN_LIB_DIR=build-nosan/src bash tests/run-fnsan.sh 2>&1 | tee /tmp/fnsan-run.log

      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-fnsan-${{ runner.os }}-${{ github.sha }}

  # Phase 3A/4 of docs/archive/suite-timing-trends-plan.md.
  #
  # A SEPARATE job, not a step on `test`, specifically because of the
  # concurrency group.  `group: ci-metrics` serializes publishers so two runs
  # cannot race the same branch -- but hung on the `test` job it would serialize
  # the whole build-and-test matrix across runs, which is an enormous cost for a
  # metrics feature.  Isolated here it serializes only an artifact download and
  # a git push.
  publish-timings:
    name: Publish suite timings
    needs: [test, jit, web-smoke]
    # always(): a red run's timings are the interesting ones (a suite that
    # regressed into a timeout), so publish regardless of upstream job status.
    # Restricted to main pushes: PR runs -- especially from forks, whose token
    # is read-only -- collect and upload artifacts but must never write.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Scoped to this job rather than declared workflow-wide: a top-level block
      # would silently re-scope every other job's token too.
      contents: write
    concurrency:
      group: ci-metrics
      cancel-in-progress: false
    steps:
      # Full history: the publish script pushes a branch, and a shallow clone
      # can have a push rejected with "shallow update not allowed".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: timings-*
          path: timings-artifacts

      # Line counts are a property of the COMMIT, not of a runner, so they are
      # measured here -- once, on the full checkout this job already has -- and
      # not in a matrix leg, where every os x cc combination would publish its
      # own identical row.  No build is needed: the collector only reads
      # `git ls-files`.
      - name: Collect line counts
        run: |
          set -euo pipefail
          python3 tools/ci/collect-loc.py --explain > repo-loc.jsonl

      - name: Merge and publish
        run: |
          set -euo pipefail
          # Every leg of both matrices contributes a file; each row carries its
          # own (build_type, os, cc, nproc, jit) tuple, so they coexist in one
          # log and are separated at query time rather than at write time.
          find timings-artifacts -name 'timings.jsonl' -print0 \
            | xargs -0 cat > all-timings.jsonl 2>/dev/null || true
          if [ ! -s all-timings.jsonl ]; then
            echo "::warning::no suite timings collected; nothing to publish"
            exit 0
          fi
          echo "collected $(wc -l < all-timings.jsonl) rows from $(find timings-artifacts -name timings.jsonl | wc -l) leg(s)"
          bash tools/ci/publish-timings.sh all-timings.jsonl --loc repo-loc.jsonl

  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Windows build + suite ${{ matrix.shard }} (MSYS2/UCRT64)
    runs-on: windows-latest

    # SHARDED because a single Windows runner could not finish it reliably.
    # The suite is ~2816 fixtures at ~2.2s each on Windows -- `tur` spawns cc,
    # cc spawns cc1/as/ld, and a process launch there costs ~50x what it does
    # on Linux -- so one runner spent 28-52 min on this step.  On 2026-09-06 a
    # run reached 52m and the runner then died outright ("The hosted runner
    # lost communication with the server ... starves it for CPU/Memory"),
    # losing the logs with it, so this is a reliability fix as much as a
    # latency one.
    #
    # Three shards, ~10 min each.  The corpus is split by ORDINAL
    # (TUR_TEST_SHARD="i/n" in tests/run.sh), so the union is exactly the full
    # set and no fixture is dropped or double-counted.  fail-fast is off: one
    # shard going red must not cancel the evidence in the other two.
    #
    # This costs three runners where it used to cost one.  Actions minutes are
    # free on a public repo, so the trade is wall-clock and reliability against
    # nothing.
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']

    # Windows had NO CI coverage: `test` and `jit` both pin
    # [ubuntu-latest, macos-latest].  In the ~899 commits after the bring-up
    # merged (7a16ef1de), five independent breaks accumulated -- three of them
    # inside one five-day window -- and `tur.exe` stopped building entirely
    # before anyone noticed.  This job exists so that cannot happen silently
    # again.
    #
    # It BUILDS **AND RUNS THE FIXTURE SUITE**.  It used to build only, because
    # ~54 fixtures failed on Windows for known pre-existing reasons and a
    # permanently-red job teaches people to ignore it -- strictly worse than no
    # job.  That comment ended "turn the suite on here once those classes are
    # closed"; they are now closed, so this is that flip.
    #
    # Building alone is NOT enough, and the gap is not hypothetical.  `-ldl`
    # (Windows has no libdl) reached main in three new jit-ffi fixtures and this
    # job stayed green through it, because the failure is a LINK error when
    # building a FIXTURE, not when building tur.exe.  Compile-only coverage
    # cannot see that class, and that class is what accumulates while nobody is
    # looking.
    #
    # The remaining known-bad fixtures PASS-skip through markers rather than
    # being tolerated as red, so a NEW failure is unambiguous:
    #   requires.posix-apis          -- POSIX-only APIs (11 fixtures)
    #   requires.win64-aggregate-abi -- the SysV/Win64 aggregate-return
    #                                   threshold (docs/reported/
    #                                   win64-aggregate-return-threshold-is-sysv.md)
    #
    # Separate job rather than a third entry in the `test` matrix because
    # nothing in that job's shape transfers: it wants apt/brew, a POSIX ccache
    # setup, and ends in `ctest`.
    defaults:
      run:
        shell: msys2 {0}

    steps:
      # Before checkout: git on Windows defaults to core.autocrlf=true, which
      # would rewrite every LF file in the tree.  The committed split-runtime
      # artifacts (src/runtime/generated/) and the shell harnesses are
      # line-ending sensitive, and a CRLF checkout makes any regeneration here
      # produce a whole-file diff.  `input` keeps the working tree as committed.
      - name: Keep LF line endings
        shell: bash
        run: git config --global core.autocrlf input

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # UCRT64 (not MINGW64, not the plain MSYS shell): the port targets the
      # UCRT runtime, and MSYSTEM selects which toolchain lands on PATH.
      # UCRT64 (not MINGW64, not the plain MSYS shell): the port targets the
      # UCRT runtime, and MSYSTEM selects which toolchain lands on PATH.
      #
      # Only what the BUILD genuinely requires goes here.  A pacman -S
      # transaction is all-or-nothing, so one unresolvable name aborts the whole
      # step and the job never reaches Configure -- which is exactly what
      # happened when this list carried a nonexistent
      # `mingw-w64-ucrt-x86_64-libedit`: the leg produced zero Windows signal
      # while still appearing green-adjacent in the checks list.  Optional
      # packages go in the non-fatal step below instead.
      # diffutils and python are for the FIXTURE SUITE, not the build.
      # tests/run.sh compares every fixture with `diff`, and MSYS2 does not ship
      # it in the base image -- this job already learned that the hard way (see
      # the end-to-end step below, where a missing `diff` reported itself as a
      # codegen failure).  Two hook.sh fixtures shell out to `python3`.
      # Both are REQUIRED here, so they belong in this all-or-nothing
      # transaction rather than the non-fatal optional step below.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            diffutils
            python
            git

      # Optional: line editing for the REPL (HAVE_EDITLINE in
      # src/CMakeLists.txt).  The package is `wineditline`, NOT `libedit` --
      # verified with `pacman -Qo /ucrt64/lib/libedit.dll.a`, which is the exact
      # file CMake's HAVE_EDITLINE probe finds, and it is owned by
      # mingw-w64-ucrt-x86_64-wineditline.  (CLAUDE.md says the same: "MSYS2
      # ships wineditline".)
      #
      # `|| true` regardless, mirroring the macOS legs' `brew install libedit
      # ccache || true`: the build succeeds without it, just with a degraded
      # REPL, so an unavailable optional package must never be able to take the
      # whole leg down again.
      - name: Install optional REPL line editing (non-fatal)
        run: pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-wineditline || true

      - name: Toolchain versions
        run: |
          echo "MSYSTEM=$MSYSTEM"
          cc --version | head -1
          cmake --version | head -1

      # Ninja, not the default generator: matches `just build-windows`, so a
      # local repro of a CI failure is the same command.  Sanitizers are off on
      # this leg regardless -- MinGW gcc ships no ASan/UBSan runtime, and
      # src/CMakeLists.txt already reports that at configure time.
      - name: Configure
        run: >-
          cmake -S . -B build-win -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build-win -j

      - name: Smoke check (tur.exe --version must not hang)
        if: matrix.shard == '1/3'   # once: this checks the binary, and every shard builds the same one
        run: |
          out=$(timeout 10 ./build-win/tur.exe --version)
          rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::tur.exe --version failed or hung (exit $rc)"
            exit 1
          fi
          case "$out" in
            *"the Turmeric compiler"*) ;;
            *) echo "::error::unexpected tur.exe --version output"; exit 1 ;;
          esac

      # A bare compile of `tur` proves far less than it looks: it says nothing
      # about whether the compiler can drive cc, link against libturi, and
      # produce a binary that runs.  One real fixture end-to-end covers the
      # whole emit -> cc -> link -> execute path for the cost of a few seconds.
      - name: End-to-end (compile and run a fixture)
        if: matrix.shard == '1/3'   # once: a single fixture round trip, not shard-specific
        run: |
          ./build-win/tur.exe build tests/fixtures/arith/input.tur -o ./arith-smoke.exe
          ./arith-smoke.exe > ./arith-smoke.out
          # Compared in bash, not with `diff`.  The UCRT64 environment installs
          # only what the build needs (gcc/cmake/ninja) and diffutils is not in
          # that set, so `diff` was `command not found` -- which `if !` then
          # reported as "output did not match".  The comparison had never run,
          # and the message named the wrong cause: this leg's FIRST green build
          # (after the libedit fix in d7ed892c let it past pacman at all) was
          # reported as a codegen failure.  Same shape as the bare `timeout` in
          # run-jit.sh that hid 407 macOS failures.
          #
          # Bash string equality needs no package and cannot go missing, and
          # `$(< f)` is a builtin redirection, so not even `cat` is required.
          # The CR strip keeps the check honest if stdout ever stops being set
          # to binary mode (the emitted main() calls _setmode(_O_BINARY) today,
          # so output is LF and matches the LF-checked-out fixture).
          expected=$(< tests/fixtures/arith/expected.stdout)
          actual=$(< ./arith-smoke.out)
          expected=${expected//$'\r'/}
          actual=${actual//$'\r'/}
          if [ "$expected" != "$actual" ]; then
            echo "expected:"; printf '%s\n' "$expected"
            echo "actual:";   printf '%s\n' "$actual"
            echo "::error::fixture 'arith' ran but its output did not match expected.stdout"
            exit 1
          fi
          echo "fixture 'arith' compiled, ran, and matched expected.stdout"

      # The actual platform guard.  Build-only coverage cannot see a fixture
      # that fails to LINK or to RUN, which is how `-ldl` reached main.
      #
      # TUR= points the harness at this build tree; it derives the libturi -L
      # from that path and exports TUR_BIND_LOOPBACK=1 so socket fixtures do not
      # trip the Defender firewall dialog.  Debug build on purpose: a Release
      # tur elides contract checks (rt_contracts_emitted is #ifdef NDEBUG), so
      # every fixture pinning a contract panic would fail against it.
      # The stdio protocol servers.  Neither ctest nor the LSP/DAP harnesses
      # run in this job, so `tur lsp` and `tur dap` were completely dead on
      # Windows -- exit 0, no output, no diagnostic -- and nothing noticed
      # until an editor was pointed at them.  Cheap enough to run here even
      # though the full harnesses are not wired up yet (they have two known
      # Windows failures: docs/reported/lsp-dap-windows-gaps.md).
      - name: LSP/DAP stdio smoke test
        if: matrix.shard == '1/3'   # once
        run: python tests/lsp/stdio-smoke.py ./build-win/tur.exe

      # The LSP end-to-end harness: 70 assertions over `tur lsp` and `tur mcp`.
      # It has existed for a long time and had never run on Windows -- this job
      # invokes tests/run.sh only, never ctest -- which is how `tur lsp` came to
      # be completely dead there, and how cross-module definition, completion
      # and rename came to return empty, without a single red check.
      #
      # tur_dap is deliberately not here yet: it passes everything except the
      # time-travel replay section (docs/reported/lsp-dap-windows-gaps.md), and
      # a job that is red for one known reason teaches people to ignore it.
      - name: LSP end-to-end harness
        if: matrix.shard == '1/3'   # once
        run: TUR=./build-win/tur.exe bash tests/lsp/run-mcp-lsp.sh

      # The DAP driver: 68 assertions over breakpoints, stepping, variables,
      # evaluate and the time-travel replay.  Held out of this job until the
      # debuggee-output capture worked on Windows -- without it the program own
      # stdout landed in the JSON-RPC stream and desynchronised every client,
      # so the harness could not have passed here.
      - name: DAP end-to-end harness
        if: matrix.shard == '1/3'   # once
        run: TUR=./build-win/tur.exe bash tests/run-dap.sh

      # The package manager had NO check on this platform: the job below runs
      # tests/run.sh directly and never ctest, which is where both of these
      # live for the other legs.  In that gap `tur fetch` could not fetch
      # anything (POSIX shell quoting handed to cmd.exe), tur.lock was never
      # read back (a text-mode read short of its own ftell size), the
      # integrity hash shelled out to a tool MinGW does not ship, and
      # rename() left every registry write-once -- four silent defects, no
      # red check.  Same shape as the `tur lsp` gap noted above.
      - name: Spice fetch + lockfile integrity
        if: matrix.shard == '1/3'   # once
        run: TUR_REQUIRE_GIT=1 TUR=./build-win/tur.exe bash tests/run-spice-fetch.sh

      - name: Install / uninstall / upgrade harness
        if: matrix.shard == '1/3'   # once
        run: TUR=./build-win/tur.exe bash tests/run-install.sh

      # cc-path-preamble-split-plan: the preamble split is the default here, and
      # it FAILS CLOSED -- a declined swap keeps the whole preamble and every
      # fixture still passes, slower.  This probe is what notices.  It replaces
      # the `windows-split` job, which ran the suite under TUR_RUNTIME=split
      # while the split was opt-in; the suite below now runs it by default.
      - name: Verify the preamble split engages by default
        run: |
          printf '(defn main [] : int 0)\n' > /tmp/splitprobe.tur
          out=$(TUR_SHOW_CC=1 TUR_JIT_TIMING=1 \
                  ./build-win/tur.exe build /tmp/splitprobe.tur -o /tmp/splitprobe.exe 2>&1) || true
          printf '%s\n' "$out"
          case "$out" in
            *-lturt_preamble*) ;;
            *) echo "::error::a default build did not take the preamble split on Windows -- see any 'disengaged' reason above"
               exit 1 ;;
          esac
          /tmp/splitprobe.exe || { echo "::error::split-built binary did not run"; exit 1; }
          echo "the default build takes the split and the artifact runs."

      - name: Fixture suite
        env:
          TUR_TEST_SHARD: ${{ matrix.shard }}
        run: |
          TUR=./build-win/tur.exe bash tests/run.sh 2>&1 | tee ./suite.log
          # tee returns tee's status, so read the harness's own summary line
          # rather than $? -- and treat a MISSING summary as failure, so a
          # harness that dies early cannot pass by printing nothing.
          summary=$(grep -E '^summary: ' ./suite.log | tail -1)
          if [ -z "$summary" ]; then
            echo "::error::suite produced no summary line (harness died early?)"
            exit 1
          fi
          echo "$summary"
          case "$summary" in
            *" 0 failed") echo "suite clean" ;;
            *) echo "::error::$summary"; exit 1 ;;
          esac

      - name: Upload suite log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suite-log-windows-${{ strategy.job-index }}
          path: ./suite.log
          if-no-files-found: ignore

  windows-jit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Windows JIT build (MSYS2/UCRT64)
    runs-on: windows-latest

    # BUILD + SMOKE, and a separate job rather than a step on `windows:`.
    #
    # Nothing on Windows compiled the JIT sources at all until this existed:
    # the `windows` job configured without -DTUR_JIT=ON, so src/jit_engine.c and
    # src/turi/jit_ffi.c were unguarded by CI on the one platform whose headers
    # differ most.  (Since TUR_JIT defaulted ON, 2026-10-02, `windows` builds
    # the engine as well; this job is still the only one that RUNS it there.)  That is how jit_ffi.c reached main with an unguarded
    # <dlfcn.h>, which MinGW does not ship -- the Windows JIT build was simply
    # broken and no job noticed.
    #
    # It does not run the full JIT corpus, only the three-tier smoke check at the
    # end.  The original reason -- the corpus was red on every CPS/effect
    # fixture -- no longer holds: that was the win64 SEH unwind through JIT
    # frames, fixed by tur_sjlj_x64_win.S, and the corpus is now 2702 passed /
    # 0 failed / 70 skipped on Windows
    # (docs/archive/jit-windows-support-spike.md).  Two things keep it off:
    # runner time (shard it like `windows` above -- a third of the corpus
    # takes ~5.5 min on a 12-core box), and the fallback ratchet, whose
    # baseline is Linux-generated and would fail on the ~47 fixtures that fall
    # back to cc only on Windows.  See docs/reported/windows-jit-corpus-not-in-ci.md.
    #
    # Separate job so it runs in parallel with `windows:` rather than adding its
    # smoke checks onto that job's ~30 minutes.
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Keep LF line endings
        shell: bash
        run: git config --global core.autocrlf input

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Toolchain versions
        run: |
          cc --version | head -1
          cmake --version | head -1

      # -DTUR_JIT=ON although it is the default (vendored MIR, no network):
      # this job exists to guard the engine, so it must not follow the default
      # if that ever moves.
      - name: Configure (Debug + JIT)
        run: >-
          cmake -S . -B build-win-jit -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DTUR_JIT=ON
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build-win-jit -j

      # Same reasoning as the `jit` job: a build that silently lost -DTUR_JIT=ON
      # would pass this job having compiled none of the sources it exists to
      # guard.
      # Needs a real file -- a bare `tur jit` prints its usage line with or
      # without the engine (see the `jit` job's copy of this step).
      - name: Verify the JIT engine is actually present
        run: |
          printf '(defn main [] : int (do (println "jit-ok") 0))\n' > jit-probe.tur
          out=$(timeout 30 ./build-win-jit/tur.exe jit jit-probe.tur 2>&1) || true
          echo "$out"
          case "$out" in
            *"jit-ok"*)
              echo "JIT engine present." ;;
            *)
              echo "::error::tur.exe was built without the MIR JIT engine -- this job would pass having compiled nothing it guards."
              exit 1 ;;
          esac

      # The three generation tiers, on a program small enough that the check is
      # about the tier and not about the program.  lazy is the DEFAULT tier, and
      # it had never once worked on Windows: _MIR_get_wrapper patched its win64
      # immediates 10 bytes short, so the wrapper's first instruction decoded as
      # a store through a garbage %rax and every default-mode JIT run segfaulted
      # before the generation hook could run.  Fixed in the MIR pin; covered
      # upstream by mir-tests/wrapper-abi.c.  A regression is silent without
      # this: interp and eager keep working, so nothing else here would notice.
      - name: Smoke-test all three JIT generation tiers
        run: |
          cat > jit-smoke.tur <<'EOF'
          (defn main [] : int
            (println "jit hello")
            0)
          EOF
          fail=0
          for mode in interp eager lazy; do
            out=$(TUR_JIT_GEN=$mode timeout 120 ./build-win-jit/tur.exe jit jit-smoke.tur 2>&1)
            rc=$?
            case "$out" in
              *"jit hello"*)
                if [ "$rc" -eq 0 ]; then echo "$mode: ok"; continue; fi ;;
            esac
            echo "::error::TUR_JIT_GEN=$mode failed (rc=$rc)"
            echo "$out"
            fail=1
          done
          exit $fail

      # The step above cannot see a cc fallback: `tur jit` falls back silently
      # (TUR-W0070 on stderr) and the fallback prints "jit hello" too.  This one
      # fails on the warning, over the two shapes that fell back on Windows
      # until 2026-09-26:
      #   - the whole-preamble path (TUR_JIT_NO_SPLIT=1), what the JIT runs when
      #     S2 disengages.  It could not link at all here: c2mir's win64
      #     va_start was the MSVC intrinsic, and winpthreads / clock_gettime /
      #     nanosleep / sprintf are not in tur.exe's export table;
      #   - a variadic C DEFINITION on the default split path, which fell back
      #     for the same va_start reason.
      # See docs/archive/jit-windows-support-spike.md, "Resolution: the
      # whole-preamble fallback".
      - name: Smoke-test the whole-preamble fallback and a variadic definition
        run: |
          fail=0
          for mode in interp eager lazy; do
            out=$(TUR_JIT_NO_SPLIT=1 TUR_JIT_GEN=$mode timeout 120 ./build-win-jit/tur.exe jit jit-smoke.tur 2>&1)
            rc=$?
            case "$out" in
              *TUR-W0070*) echo "::error::no-split $mode fell back to cc"; echo "$out"; fail=1 ;;
              *"jit hello"*) [ "$rc" -eq 0 ] && echo "no-split $mode: ok" || { echo "::error::no-split $mode rc=$rc"; fail=1; } ;;
              *) echo "::error::no-split $mode failed (rc=$rc)"; echo "$out"; fail=1 ;;
            esac
          done
          for split in 0 1; do
            out=$(TUR_JIT_NO_SPLIT=$split timeout 120 ./build-win-jit/tur.exe jit tests/fixtures/inline-c-variadic-definition/input.tur 2>&1)
            rc=$?
            want=$(cat tests/fixtures/inline-c-variadic-definition/expected.stdout)
            case "$out" in
              *TUR-W0070*) echo "::error::variadic (no-split=$split) fell back to cc"; echo "$out"; fail=1 ;;
              *"$want"*) [ "$rc" -eq 0 ] && echo "variadic (no-split=$split): ok" || { echo "::error::variadic rc=$rc"; fail=1; } ;;
              *) echo "::error::variadic (no-split=$split) wrong output (rc=$rc)"; echo "$out"; fail=1 ;;
            esac
          done
          exit $fail

      # `tur repl --engine jit` builds a module-name shadow directory for the
      # spice.  It used symlink(), which platform_fs.h stubs to ENOSYS on
      # Windows, so the in-process load never happened here -- every load
      # quietly took the subprocess build instead.  repl_jit_build now hard-
      # links (or copies) there, and the script's first case fails on any sign
      # of that fallback.
      - name: REPL spice load through the JIT
        run: TUR=./build-win-jit/tur.exe timeout 600 bash tests/turi/repl-spice-jit.sh

  check-guides:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.guides == 'true'
    name: Check guide toggle pairs
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      # Don't hash the build dir, and rewrite absolute paths under the workspace
      # to relative, so the -g Debug build's embedded paths don't defeat cross-run
      # hits (mirrors CCACHE_NOHASHDIR in tests/run.sh).
      CCACHE_NOHASHDIR: "1"
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          # Drop the runner image's Google Chrome apt source and retry the
          # update once -- see the `test` job's dependency step for why.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update || { sleep 20; sudo apt-get update; }
          sudo apt-get install -y libedit-dev ccache
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-guides-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-guides-${{ runner.os }}-
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_C_COMPILER_LAUNCHER=ccache
      - name: Build tur
        run: cmake --build build -j --target tur
      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-guides-${{ runner.os }}-${{ github.sha }}
      - name: Check guide pairs (AST-verified via tur parse-check)
        run: python3 tools/check-guide-pairs.py --tur build/tur docs/guides/

  check-spaced-types:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.guides == 'true'
    name: Check spaced-type annotations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check fused annotations in stdlib/ and docs/guides/
        run: python3 tools/spaced-types-rewrite.py --check stdlib/ docs/guides/

  # C-1: tvm is the advertised install path now -- turmeric-lang.com/install
  # bootstraps it and installs a checksum-verified release through it. Its two
  # suites ran NOWHERE automatic before that change: not in this file, not in
  # ctest, not in the Justfile. A version manager nobody tests is a poor thing
  # to make load-bearing, so they run here.
  #
  # Both are fully offline -- a fake release served over file:// URLs -- so
  # this job is seconds, needs no compiler, and cannot flake on the network.
  # It runs on both OSes because the install path is platform-shaped: shell rc
  # detection, tar layouts, `sha256sum` vs `shasum`, and the target triple all
  # differ, and macOS is where the advertised one-liner is most used.
  tvm:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: tvm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The suite asserts `tvm current` is `none` before anything is
      # installed, which a tur already on PATH would contradict. The runners
      # have none; this guard says so out loud rather than leaving a future
      # toolchain image to make it a mystery failure.
      - name: Check no tur is already on PATH
        run: |
          if command -v tur >/dev/null 2>&1; then
            echo "::error::a tur is already on PATH ($(command -v tur)); the tvm suite assumes none"
            exit 1
          fi

      - name: tvm suite
        run: sh tvm/tests/run.sh

      # Drives web/worker.js's own /install route, so an edit that breaks the
      # served installer fails here rather than on someone's laptop.
      - name: Installer end-to-end (C-1)
        run: sh tvm/tests/install-script.sh

  check-snapshots:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Check codegen snapshots
    runs-on: ubuntu-latest
    # Only run when src/codegen/ changed or expected.c files changed.
    # This prevents the job from failing on PRs that don't touch codegen at all.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      # Don't hash the build dir, and rewrite absolute paths under the workspace
      # to relative, so the -g Debug build's embedded paths don't defeat cross-run
      # hits (mirrors CCACHE_NOHASHDIR in tests/run.sh).
      CCACHE_NOHASHDIR: "1"
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Install dependencies (Linux)
        run: |
          # Drop the runner image's Google Chrome apt source and retry the
          # update once -- see the `test` job's dependency step for why.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update || { sleep 20; sudo apt-get update; }
          sudo apt-get install -y libedit-dev ccache

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-snapshots-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-snapshots-${{ runner.os }}-

      - name: Configure (Debug)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build tur
        run: cmake --build build -j --target tur

      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-snapshots-${{ runner.os }}-${{ github.sha }}

      - name: Check for snapshot drift
        run: ./build/tur run regen-snapshots -- --check

  web-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.guides == 'true'
    name: Try Turmeric smoke test (browser)
    runs-on: ubuntu-latest
    # Pre-deploy gate for try.turmeric-lang.com: builds the wasm bundle and
    # drives the browser REPL through one evaluation.  If this fails, the
    # branch is not safe to `npm run deploy` from web/.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      # Don't hash the build dir, and rewrite absolute paths under the workspace
      # to relative, so the -g Debug build's embedded paths don't defeat cross-run
      # hits (mirrors CCACHE_NOHASHDIR in tests/run.sh).
      CCACHE_NOHASHDIR: "1"
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (Linux)
        run: |
          # Drop the runner image's Google Chrome apt source and retry the
          # update once -- see the `test` job's dependency step for why.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update || { sleep 20; sudo apt-get update; }
          sudo apt-get install -y libedit-dev ccache

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-web-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-web-${{ runner.os }}-

      - name: Set up Python (for gendocs)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python doc deps (markdown)
        # C-5: --require-hashes, and NOT --upgrade.  `--upgrade` against a
        # floor-only requirement took whatever PyPI served that morning; the
        # file is pinned with digests now, so upgrading past the pin is
        # exactly what must not happen.
        run: python3 -m pip install --require-hashes -r tools/requirements.txt

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          # Pinned to a modern release; bump alongside the wasm build if the
          # emcc surface changes (currently only the -sSTACK_SIZE / INITIAL_MEMORY
          # link flags are load-bearing -- see src/CMakeLists.txt).
          #
          # C-5: this comment said "pinned" directly above the word `latest`
          # for as long as it has existed.  It is pinned now.  Keep this in
          # step with the tur_refine_wasm job's copy above.
          version: 6.0.10
          actions-cache-folder: 'emsdk-cache'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Configure (Debug, native tur)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build native tur (needed for docs / doc-names.json)
        run: cmake --build build -j --target tur

      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-web-${{ runner.os }}-${{ github.sha }}

      - name: Generate stdlib docs (writes web/public/doc-names.json)
        run: ./build/tur run docs

      - name: Configure + build WASM
        run: |
          cmake -S . -B build-wasm -DTUR_WASM=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build-wasm -j --target tur_wasm

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # The mobile project is devices['iPhone 13'], which is WebKit -- so with
      # only Chromium installed, every one of its 32 tests died at
      # `browserType.launch: Executable doesn't exist at .../webkit-*/pw_run.sh`
      # before any test body ran, and the step's continue-on-error hid it.
      # That is the whole mobile suite (tabs, project load/download, the split
      # handle, the PWA manifest, mobile LSP) asserting nothing.
      #
      # Its own step, and non-blocking, because the job's gate is
      # deploy-gate.spec.js on Chromium: a WebKit download that fails on a
      # runner must leave the mobile suite exactly as unrun as it is today, not
      # redden a job that was going to pass.
      - name: Install Playwright WebKit (for the mobile project, non-blocking)
        working-directory: web
        continue-on-error: true
        run: npx playwright install --with-deps webkit

      # Step-level timeouts, not a job-level one: a job timeout CANCELS the
      # job, and then the `!cancelled()` report upload below never runs -- the
      # failure mode docs/archive/macos-jit-hang-loses-both-diagnostics.md
      # records.  A step timeout fails the step and the evidence still uploads.
      # Healthy durations on main: gate 7 s, desktop ~3.5 min, mobile ~2 min.
      - name: Run deploy-gate smoke test
        id: gate
        working-directory: web
        timeout-minutes: 5
        run: npx playwright test deploy-gate.spec.js --project=desktop

      # docs-offline.spec.js asserts a property of the *built* artefact: the
      # service worker precaching the docs pack, and the app booting from cache
      # with the origin gone. Vite's dev server rewrites the module graph on the
      # fly, and none of those dev-only URLs are precached, so the spec skips
      # itself unless a production build exists. Build one, or the spec passes
      # by not running -- which looks identical to passing.
      - name: Build the web bundle (for the offline docs spec)
        working-directory: web
        run: npm run build

      # Paths, not bare filenames: Playwright treats a positional argument as a
      # regex over the test file path, so `smoke.spec.js` also matches
      # `prod-smoke.spec.js` -- which tests the *live* turmeric-lang.com, has
      # its own config, and is meant to be run by `npm run test:prod`. Pulled in
      # here it contributed three standing failures (two from being pointed at
      # localhost instead of production, one from a stale hardcoded guide list),
      # which this step's continue-on-error quietly absorbed.
      # This list is the whole of what the desktop suite runs: Playwright only
      # picks up the paths named here, so a spec file that is not on it passes
      # by not running -- the same trap the docs-offline note above describes,
      # one level up. lsp.spec.js and the navigation specs
      # (try-turmeric-navigation-and-minimap-plan §8) were written against a
      # bundle CI is the first place to actually build, so they are named here
      # rather than left to be discovered. ci.spec.js (the /ci dashboard) was
      # itself an instance of that trap: it existed, passed locally, and had
      # never run here.
      # Each suite also writes JUnit (one <testcase> per test) for the timings
      # step below, so both get /ci rows like every ctest suite -- including an
      # honest `status: fail` on a run whose job stayed green, which is still
      # reachable for mobile
      # (docs/archive/try-turmeric-browser-suites-green-while-failing.md).
      #
      # BLOCKING since 2026-10-02, which is that report's fix direction 6 and
      # was left to a human on purpose.  What changed is that the condition it
      # set -- "once the desktop suite is genuinely clean" -- is now true and
      # measured rather than asserted: the last standing failure was marked in
      # docs/reported/docs-offline-cold-pane-never-boots.md, and the /ci
      # history puts the residual ISOLATED flake at 6 commits in 266 (2.3%),
      # damped by `retries: 2` in playwright.config.js (see the note there).
      #
      # If this does block PRs on flake after all, the honest revert is
      # `continue-on-error: true` back on this step -- not deleting specs from
      # the path list below, which lowers the failure count by running less and
      # is the failure mode that report calls "a regression wearing a fix's
      # clothes".
      - name: Run broader smoke suite (desktop) -- BLOCKING
        id: desktop
        working-directory: web
        timeout-minutes: 15
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results-desktop.xml
        run: npx playwright test --project=desktop --reporter=list,junit
          tests/smoke.spec.js tests/diag.spec.js tests/guide-toggle.spec.js
          tests/meta-commands.spec.js tests/docs-pane.spec.js
          tests/docs-offline.spec.js tests/lsp.spec.js
          tests/minimap.spec.js tests/footer.spec.js
          tests/lang-picker.spec.js tests/sw-dev.spec.js tests/trace.spec.js
          tests/security.spec.js tests/ci.spec.js

      # Not the default `success()`, because the desktop step above now
      # BLOCKS: a desktop failure would skip this step, mobile would produce no
      # JUnit, and collect-playwright-timings would report web_mobile as `skip`
      # with "suite did not run" -- so a desktop regression would silently cost
      # the mobile row too, and the skip ledger would blame the wrong thing.
      #
      # Not `always()` either: that also ran it after the deploy gate failed,
      # and a gate failure is usually a wasm module that never reaches Ready.
      # Then every mobile test waits out its timeout, three times over with
      # `retries: 2`, and the job sat "in progress" for most of an hour after
      # its verdict was already in (PR #1053, 2026-10-03).  The gate is the
      # precondition the desktop step already skips on; mobile does too.
      #
      # Still non-blocking, and NOT because its tests are worse: mobile's
      # isolated-flake rate (1.9%) is lower than desktop's and its clean streak
      # is longer.  The blocker is its precondition -- the WebKit download step
      # above is itself `continue-on-error`, and when that fails the whole
      # project dies at `browserType.launch: Executable doesn't exist` before
      # any test body runs (the post-mortem in that step's own comment).
      # Gating here would turn a third-party download failure into a blocked
      # PR, which is infrastructure flake, not a test signal.
      - name: Run mobile smoke suite (non-blocking)
        id: mobile
        if: ${{ !cancelled() && steps.gate.outcome == 'success' }}
        working-directory: web
        continue-on-error: true
        timeout-minutes: 10
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results-mobile.xml
        run: npx playwright test --project=mobile --reporter=list,junit

      # Mobile still needs this: a non-blocking failure must announce itself on
      # the job summary and as an annotation, not five thousand lines down a
      # log.  Desktop no longer depends on it to be noticed -- the job is red
      # -- but it stays in the table so both are read the same way, and its
      # annotation is `::error` rather than `::warning` to match.
      #
      # `outcome` is the step result BEFORE continue-on-error is applied, so it
      # reads "failure" for either step regardless of which one gates.
      - name: Report browser suite outcomes
        if: always()
        run: |
          {
            echo "### Try Turmeric browser suites"
            echo
            echo "| suite | outcome |"
            echo "|---|---|"
            echo "| deploy-gate (blocking) | ${{ steps.gate.outcome }} |"
            echo "| desktop (blocking) | ${{ steps.desktop.outcome }} |"
            echo "| mobile (non-blocking) | ${{ steps.mobile.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.desktop.outcome }}" = "failure" ]; then
            echo "::error title=Try Turmeric desktop suite failed::this suite BLOCKS -- see the playwright-report artifact and the web_desktop row on /ci"
          fi
          if [ "${{ steps.mobile.outcome }}" = "failure" ]; then
            echo "::warning title=Try Turmeric mobile suite failed::non-blocking, but see the playwright-report artifact and the web_mobile row on /ci"
          fi

      - name: Collect browser suite timings
        if: always()
        run: |
          python3 tools/ci/collect-playwright-timings.py \
            --suite web_desktop web/results-desktop.xml \
            --suite web_mobile  web/results-mobile.xml > timings.jsonl || true
          echo "collected $(wc -l < timings.jsonl) browser suite rows"

      - name: Upload browser suite timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timings-web
          path: timings.jsonl
          if-no-files-found: warn
          retention-days: 7

      # `!cancelled()`, not `failure()`.  Written when BOTH suites were
      # continue-on-error, so a failing suite never put the job into a failure
      # state and `failure()` uploaded the report only when nothing had failed
      # -- the one case it was not needed.  Desktop blocks now, so `failure()`
      # would cover that one; mobile is still continue-on-error and would still
      # slip through, and `!cancelled()` covers both without anyone having to
      # re-derive which suite gates.  The report is the evidence; upload it
      # every time.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

id: eavt
title: Immutable EAVT Database
description: >
  Build an append-only fact database with Entity-Attribute-Value-Transaction
  semantics, inspired by Datomic. Covers core types, query combinators, temporal
  as-of queries, retraction, hash-based indexing, and a Datalog-style query layer.
category: data-structures
difficulty: 3
steps:
  - id: value_adt
    title: The Value ADT
    instruction: |
      Every fact stores a typed value. Define the Value ADT with three variants.
      `^copy` because a fact is immutable: its value is read and compared,
      never consumed.
        (defdata ^copy Value (LongVal :int) (StrVal :cstr) (EntityVal :int))
    expected: "(defdata ^copy Value (LongVal :int) (StrVal :cstr) (EntityVal :int))"
    hints:
      - "Use defdata to define a tagged union."
      - "LongVal holds integers, StrVal holds strings, EntityVal holds entity IDs."
    success_message: "Correct! The Value ADT lets the database store different payload types in a uniform way."
    match_strategy: normalized

  - id: long_val_constructor
    title: Constructing a LongVal
    instruction: |
      Wrap the integer 42 in a LongVal by calling the LongVal constructor:
        (LongVal 42)
    expected: "(LongVal 42)"
    alternate_accept:
      - "(LongVal 100)"
      - "(LongVal 0)"
    hints:
      - "Constructors have the same name as the variant: (LongVal n)"
      - "The argument is the payload integer."
    success_message: "Correct! (LongVal 42) builds a Value holding 42."
    match_strategy: normalized

  - id: match_value
    title: Pattern-matching a Value
    instruction: |
      Use match to print a Value. Every constructor needs an arm -- match is
      checked for exhaustiveness, so leaving EntityVal out is a compile error,
      not a silent fall-through. Define print-value:
        (defn print-value [v : Value] : nil
          (match v
            (LongVal n)   (println n)
            (StrVal s)    (println s)
            (EntityVal e) (println e)))
    expected: "(defn print-value [v : Value] : nil (match v (LongVal n) (println n) (StrVal s) (println s) (EntityVal e) (println e)))"
    hints:
      - "match dispatches on the constructor of a Value."
      - "Each arm binds the payload to a name: (LongVal n) binds n."
      - "Value has three constructors; an arm for each, or match rejects it."
    success_message: "Correct! Pattern matching is the standard way to inspect a tagged union, and match makes you cover every case."
    match_strategy: normalized

  - id: datum_layout
    title: The Datum struct
    instruction: |
      A datum is one fact: an entity, an attribute, a value and the
      transaction that recorded it. Define it as a struct:
        (defstruct ^copy Datum [entity : int attr : cstr value : Value tx : int])
    expected: "(defstruct ^copy Datum [entity : int attr : cstr value : Value tx : int])"
    hints:
      - "A struct names each field and its type."
      - "Read a field with (.entity d), (.attr d), (.value d) or (.tx d)."
    success_message: "Correct! Datum is a typed fact -- no raw memory layout to get wrong."
    match_strategy: normalized

  - id: db_new
    title: Creating a database
    instruction: |
      The database is the log of datums, oldest first: a (Vec Datum). Name the
      type, write db-new, then create a database and bind it to db:
        (defalias Db (Vec Datum))
        (defn db-new [] : Db (vec-new))
        (def db (db-new))
    expected: "(def db (db-new))"
    hints:
      - "defalias gives a type a second name."
      - "vec-new makes an empty Vec; the declared result type says of what."
    success_message: "Correct! db is an empty, growable log of facts."
    match_strategy: normalized

  - id: db_assert
    title: Asserting a fact
    instruction: |
      db-assert! appends a fact stamped with the next transaction number --
      its 1-based position in the log -- and returns it. Define it, give
      entity 1 an age, then assert that it has attribute ":user/name" with
      value "Alice":
        (defn db-assert! [db : Db entity : int attr : cstr value : Value] : int
          (let [tx (+ (vec-len db) 1)]
            (vec-push! db (Datum entity attr value tx)) tx))
        (db-assert! db 1 ":user/age" (LongVal 30))
        (db-assert! db 1 ":user/name" (StrVal "Alice"))
    expected: "(db-assert! db 1 \":user/name\" (StrVal \"Alice\"))"
    alternate_accept:
      - "(db-assert! db 1 \":user/age\" (LongVal 30))"
    hints:
      - "db-assert! takes (db, entity, attribute name, Value)."
      - "It returns the transaction number assigned to this fact."
    success_message: "Correct! Each call to db-assert! appends one immutable datum."
    match_strategy: normalized

  - id: db_q_entity
    title: Query by entity
    instruction: |
      db-q filters the log with a predicate into a fresh Vec; q-entity builds
      the predicate. Define both, then find all facts about entity 1:
        (defn db-q [db : Db pred : (fn [Datum] bool)] : (Vec Datum)
          (let [out (:: (vec-new) (Vec Datum)) ^mut i 0]
            (while (< i (vec-len db))
              (when (pred (vec-get db i)) (vec-push! out (vec-get db i)))
              (set! i (+ i 1))) out))
        (defn q-entity [e : int] : (fn [Datum] bool)
          (fn [d : Datum] : bool (= (.entity d) e)))
        (db-q db (q-entity 1))
    expected: "(db-q db (q-entity 1))"
    alternate_accept:
      - "(db-q db (q-entity 2))"
    hints:
      - "q-entity returns a predicate: (fn [d : Datum] : bool (= (.entity d) e))"
      - "db-q applies the predicate to every datum and collects matches."
    success_message: "Correct! db-q returns a fresh Vec of the matching datums."
    match_strategy: normalized

  - id: q_attr
    title: Query by attribute
    instruction: |
      Attributes are strings, compared by their contents with cstr-eq? from
      stdlib/cstr.tur. Load it, define q-attr, and find all user names:
        (load "stdlib/cstr.tur")
        (defn q-attr [a : cstr] : (fn [Datum] bool)
          (fn [d : Datum] : bool (cstr-eq? (.attr d) a)))
        (db-q db (q-attr ":user/name"))
    expected: "(db-q db (q-attr \":user/name\"))"
    alternate_accept:
      - "(db-q db (q-attr \":user/email\"))"
    hints:
      - "q-attr returns a predicate matching on the attribute string."
      - "= does not compare strings; cstr-eq? does."
    success_message: "Correct! q-attr is useful for finding all entities that have a given property."
    match_strategy: normalized

  - id: q_and
    title: Combining predicates with q-and
    instruction: |
      Predicates compose. Define q-and and q-not, then find all :user/age
      facts that are NOT for entity 2 (Bob):
        (defn q-and [p : (fn [Datum] bool) q : (fn [Datum] bool)] : (fn [Datum] bool)
          (fn [d : Datum] : bool (and (p d) (q d))))
        (defn q-not [p : (fn [Datum] bool)] : (fn [Datum] bool)
          (fn [d : Datum] : bool (not (p d))))
        (db-q db (q-and (q-attr ":user/age") (q-not (q-entity 2))))
    expected: "(db-q db (q-and (q-attr \":user/age\") (q-not (q-entity 2))))"
    hints:
      - "q-and takes two predicates and returns one that requires both."
      - "q-not inverts a predicate."
    success_message: "Correct! Combining predicates with q-and and q-not is composable and concise."
    match_strategy: normalized

  - id: value_eq
    title: Value equality
    instruction: |
      Define value-eq? to compare two Values: the same constructor with equal
      payloads.
        (defn value-eq? [a : Value b : Value] : bool
          (match a
            (LongVal x)   (match b (LongVal y) (= x y) _ false)
            (StrVal x)    (match b (StrVal y) (cstr-eq? x y) _ false)
            (EntityVal x) (match b (EntityVal y) (= x y) _ false)))
    expected: "(defn value-eq? [a : Value b : Value] : bool (match a (LongVal x) (match b (LongVal y) (= x y) _ false) (StrVal x) (match b (StrVal y) (cstr-eq? x y) _ false) (EntityVal x) (match b (EntityVal y) (= x y) _ false)))"
    hints:
      - "The outer match dispatches on a's constructor."
      - "The inner match checks that b has the same constructor."
      - "The wildcard _ false handles mismatched constructors."
    success_message: "Correct! value-eq? is the foundation for attribute+value queries."
    match_strategy: normalized

  - id: q_av
    title: Attribute and value query (q-av)
    instruction: |
      Define q-av to find datums with a specific attribute AND value:
        (defn q-av [a : cstr v : Value] : (fn [Datum] bool)
          (fn [d : Datum] : bool (and (cstr-eq? (.attr d) a) (value-eq? (.value d) v))))
    expected: "(defn q-av [a : cstr v : Value] : (fn [Datum] bool) (fn [d : Datum] : bool (and (cstr-eq? (.attr d) a) (value-eq? (.value d) v))))"
    hints:
      - "q-av returns a closure that checks both the attribute name and the value."
      - "Use cstr-eq? for attribute comparison and value-eq? for value comparison."
    success_message: "Correct! q-av enables searching by value, e.g. find all entities with age 30."
    match_strategy: normalized

  - id: db_as_of
    title: Temporal as-of query
    instruction: |
      Define db-as-of to return all datums at or before a given transaction:
        (defn db-as-of [db : Db as-of-tx : int] : (Vec Datum)
          (db-q db (fn [d : Datum] : bool (<= (.tx d) as-of-tx))))
    expected: "(defn db-as-of [db : Db as-of-tx : int] : (Vec Datum) (db-q db (fn [d : Datum] : bool (<= (.tx d) as-of-tx))))"
    hints:
      - "db-as-of filters datums by their transaction number."
      - "Only datums with tx <= as-of-tx are included."
    success_message: "Correct! db-as-of is the heart of time travel -- it reconstructs any past snapshot."
    match_strategy: normalized

  - id: pull
    title: Pull all facts for an entity
    instruction: |
      Define pull to return every datum for a given entity:
        (defn pull [db : Db e : int] : (Vec Datum)
          (db-q db (q-entity e)))
    expected: "(defn pull [db : Db e : int] : (Vec Datum) (db-q db (q-entity e)))"
    hints:
      - "pull is equivalent to SELECT * WHERE entity = e."
      - "It returns a Vec of all matching datums."
    success_message: "Correct! pull gives you a complete view of one entity across all its attributes."
    match_strategy: normalized

  - id: db_retract
    title: Retracting a fact
    instruction: |
      Define db-retract! as a special assertion with attribute :db/retract:
        (defn db-retract! [db : Db entity : int attr : cstr] : int
          (db-assert! db entity ":db/retract" (StrVal attr)))
    expected: "(defn db-retract! [db : Db entity : int attr : cstr] : int (db-assert! db entity \":db/retract\" (StrVal attr)))"
    hints:
      - "Retraction is a new fact, not a deletion."
      - "The value of the retraction datum is the name of the attribute being retracted."
    success_message: "Correct! Representing retraction as a fact preserves the full history and makes it queryable."
    match_strategy: normalized

  - id: eavt_index
    title: EAVT hash index
    instruction: |
      The EAVT index groups datums by (entity, attribute) into 64 buckets, so
      a lookup scans one bucket instead of the whole log. It is about a
      hundred lines, more than a step should ask you to type: load the
      example, which defines it beside its own copy of the database, then
      create an indexed database and bind it to idb:
        (load "examples/datalog/indexed.tur")
        (def idb (idb-new))
    expected: "(def idb (idb-new))"
    hints:
      - "An Idb holds the log and its index and keeps them in step."
      - "Read examples/datalog/indexed.tur to see how the buckets are built."
    success_message: "Correct! The EAVT index enables O(1) average-case entity+attribute lookups."
    match_strategy: normalized

  - id: idb_assert
    title: Asserting into an indexed database
    instruction: |
      Use idb-assert! to add a fact to an indexed database.
      It appends to the log and also indexes the new datum:
        (idb-assert! idb 1 ":user/name" (StrVal "Alice"))
    expected: "(idb-assert! idb 1 \":user/name\" (StrVal \"Alice\"))"
    hints:
      - "idb-assert! wraps db-assert! and eavt-idx-insert! in one call."
      - "The idb must have been created with idb-new."
    success_message: "Correct! idb-assert! keeps the log and the index in sync."
    match_strategy: normalized

  - id: idb_q_ea
    title: Indexed entity+attribute lookup
    instruction: |
      Query an indexed database by entity and attribute using idb-q-ea:
        (idb-q-ea idb 1 ":user/name")
    expected: "(idb-q-ea idb 1 \":user/name\")"
    alternate_accept:
      - "(idb-q-ea idb 2 \":user/age\")"
    hints:
      - "idb-q-ea looks in one bucket -- no linear scan."
      - "It returns a fresh Vec of the matching datums."
    success_message: "Correct! idb-q-ea is the O(1) fast path for the most common query pattern."
    match_strategy: normalized

  - id: datalog_term
    title: Datalog terms -- Var and Lit
    instruction: |
      The Datalog layer matches patterns of Terms against the log. Load it,
      then construct a Var term for ?name and a Lit term for the string
      "Alice":
        (load "examples/datalog/datalog.tur")
        (Var "?name")
        (Lit (StrVal "Alice"))
    expected: "(Lit (StrVal \"Alice\"))"
    alternate_accept:
      - "(Var \"?name\")"
      - "(Var \"?e\")"
    hints:
      - "Var names a variable to bind."
      - "Lit wraps a concrete Value to match."
      - "Wild matches anything and binds nothing."
    success_message: "Correct! Terms are the building blocks of Datalog pattern clauses."
    match_strategy: normalized

  - id: datalog_clause
    title: Building a Datalog pattern clause
    instruction: |
      Create a pattern [?e :user/name ?name] -- a Pattern of three terms:
        (Pattern (Var "?e") (Lit (StrVal ":user/name")) (Var "?name"))
    expected: "(Pattern (Var \"?e\") (Lit (StrVal \":user/name\")) (Var \"?name\"))"
    hints:
      - "A Pattern takes three terms: entity, attribute, value."
      - "Variables will be bound when the pattern matches a datum."
    success_message: "Correct! A pattern clause unifies its three terms against every datum in the database."
    match_strategy: normalized

  - id: datalog_run
    title: Running a Datalog query
    instruction: |
      Build a small database, then run a one-clause query that finds every
      user name and print what ?name is bound to:
        (def db2 (db-new))
        (db-assert! db2 1 ":user/name" (StrVal "Alice"))
        (db-assert! db2 2 ":user/name" (StrVal "Bob"))
        (print-str-var (datalog db2 (vec-of (Pattern (Var "?e") (Lit (StrVal ":user/name")) (Var "?name")))) "?name")
    expected: "(print-str-var (datalog db2 (vec-of (Pattern (Var \"?e\") (Lit (StrVal \":user/name\")) (Var \"?name\")))) \"?name\")"
    hints:
      - "datalog takes the database and a Vec of Patterns."
      - "It returns the bindings that satisfy every clause."
      - "print-str-var prints the string a variable is bound to in each binding."
    success_message: "Correct! datalog evaluates clauses left-to-right, propagating bindings that satisfy each pattern."
    match_strategy: normalized

  - id: next_steps
    title: Where to go next
    instruction: |
      You have completed the EAVT tutorial!

      Explore the full example files -- each runs compiled, on the JIT and in
      the interpreter:
        examples/datalog/minimal.tur  -- core types and query combinators
        examples/datalog/query.tur    -- extended query API with temporal features
        examples/datalog/indexed.tur  -- EAVT hash index for O(1) lookups
        examples/datalog/blog.tur     -- multi-entity blog domain example
        examples/datalog/datalog.tur  -- Datalog-style pattern query engine

      Read the tutorial docs:
        docs/guides/datalog-01-concepts.md     -- EAVT model and comparison with SQL
        docs/guides/datalog-02-minimal-impl.md -- core implementation walkthrough
        docs/guides/datalog-03-query-api.md    -- value equality, as-of, pull, history
        docs/guides/datalog-04-indexing.md     -- hash index design and trade-offs
    expected: ""
    hints: []
    success_message: "Well done! You built an immutable EAVT database from scratch."
    verify: ~
